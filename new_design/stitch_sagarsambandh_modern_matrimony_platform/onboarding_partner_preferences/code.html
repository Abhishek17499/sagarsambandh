<script>
        // Simple interaction for the single range slider to simulate min-max visual update
        const ageRange = document.getElementById('ageRange');
        const ageDisplay = document.getElementById('ageDisplay');
        
        ageRange.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            const min = Math.max(18, val - 5);
            const max = Math.min(70, val + 5);
            ageDisplay.textContent = `${min} - ${max} yrs`;
        });
    </script>

<style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">

</header>

<div class="w-full max-w-[520px]">
<!-- Header Text & Progress -->
<div class="mb-8 text-center md:text-left">

<p class="font-body-md text-body-md text-on-surface-variant">Step 1 of 4: Basic Details</p>
<!-- Progress Bar with subtle wave motif -->
<div class="w-full h-2 bg-surface-container-high rounded-full mt-4 overflow-hidden">
<div class="h-full bg-primary rounded-full wave-progress-bg" style="width: 25%; background-color: rgb(127, 179, 213);"></div>
</div>
</div>
<!-- Form Card (Level 1 Elevation) -->
<div class="bg-surface-container-lowest rounded-[16px] p-6 md:p-8 shadow-level-1 border border-soft-sky relative overflow-hidden">
<!-- Subtle Decorative Wave at bottom of card -->
<div class="absolute bottom-0 left-0 w-full opacity-30 pointer-events-none">
<svg class="w-full h-auto text-soft-sky fill-current" preserveAspectRatio="none" viewBox="0 0 1440 120">
<path d="M0,64L80,69.3C160,75,320,85,480,80C640,75,800,53,960,48C1120,43,1280,53,1360,58.7L1440,64L1440,120L1360,120C1280,120,1120,120,960,120C800,120,640,120,480,120C320,120,160,120,80,120L0,120Z"></path>

<form class="space-y-6 relative z-10">
<!-- Full Name Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="form-input-custom rounded-lg bg-surface-container-lowest flex items-center px-4 py-3">
<span class="material-symbols-outlined text-outline mr-3">person</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="fullName" placeholder="Enter your full name" type="text">
</div>
</div>
<!-- Gender Selection (Styled Radio Buttons) -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface">Gender</label>
<div class="grid grid-cols-2 gap-4">
<!-- Male Option -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="gender" type="radio" value="male">
<div class="w-full py-3 px-4 rounded-lg border border-soft-sky text-center font-body-md text-body-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary transition-all duration-200 flex items-center justify-center gap-2">
                                    Male
                                </div>
</label>
<!-- Female Option -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="gender" type="radio" value="female">
<div class="w-full py-3 px-4 rounded-lg border border-soft-sky text-center font-body-md text-body-md text-on-surface-variant peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary transition-all duration-200 flex items-center justify-center gap-2">
                                    Female
                                </div>
</label>
</div>
</div>
<!-- Birth Date Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface">Date of Birth</label>
<div class="grid grid-cols-3 gap-3">
<!-- Day -->
<div class="form-input-custom rounded-lg bg-surface-container-lowest relative">
<select class="w-full appearance-none bg-transparent border-none px-4 py-3 focus:ring-0 font-body-md text-body-md text-on-surface pr-8">
<option disabled="" selected="" value="">Day</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
<!-- Month -->
<div class="form-input-custom rounded-lg bg-surface-container-lowest relative">
<select class="w-full appearance-none bg-transparent border-none px-4 py-3 focus:ring-0 font-body-md text-body-md text-on-surface pr-8">
<option disabled="" selected="" value="">Month</option>
<option value="1">Jan</option>
<option value="2">Feb</option>
<option value="3">Mar</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
<!-- Year -->
<div class="form-input-custom rounded-lg bg-surface-container-lowest relative">
<select class="w-full appearance-none bg-transparent border-none px-4 py-3 focus:ring-0 font-body-md text-body-md text-on-surface pr-8">
<option disabled="" selected="" value="">Year</option>
<option value="1990">1990</option>
<option value="1991">1991</option>
<option value="1992">1992</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>

<div class="pt-4">
<button class="w-full bg-earth-warmth hover:bg-secondary text-white py-4 px-6 rounded-[12px] font-label-md text-label-md flex justify-center items-center gap-2 transition-colors duration-200" type="button" style="background-color: rgb(127, 179, 213);">
                            Continue

</button>
</div>

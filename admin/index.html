<script>
// ============================================================
// FIREBASE SETUP
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyB808kwpEQ6IXgyFBUKGKnnH9Y6Lhe74_g",
  authDomain: "sagar-sambandh.firebaseapp.com",
  projectId: "sagar-sambandh",
  storageBucket: "sagar-sambandh.firebasestorage.app",
  messagingSenderId: "822553770547",
  appId: "1:822553770547:web:ffb69be461f4a38d5d8146",
};
let db = null, auth = null, storage = null, firebaseReady = false, firebaseError = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  storage = firebase.storage();
  firebaseReady = true;
} catch (e) { firebaseError = e.message; }

// App Check — verifies requests come from this real website, not a
// copy-pasted config used in someone else's script/page. Registered in
// Firebase Console (Build → App Check → Apps) with a real reCAPTCHA v3 site
// key (18 Sep 2026), same key as the User App (one Web App registration
// covers both). Enforcement is intentionally left at "Monitor" (not
// "Enforce") in Console for a few days first — see the App Check APIs tab —
// so real Admin traffic can be confirmed as verified before any request
// gets blocked. (Previously throttled once, 22 Aug 2026, from activating
// before registration — this key is the properly-registered one.)
const RECAPTCHA_V3_SITE_KEY = "6LfIeJEtAAAAABLrVMdO-js6jnYBorm7jbKkaNZj";
if (firebaseReady && RECAPTCHA_V3_SITE_KEY !== "REPLACE_WITH_RECAPTCHA_V3_SITE_KEY") {
  try {
    firebase.appCheck().activate(
      new firebase.appCheck.ReCaptchaV3Provider(RECAPTCHA_V3_SITE_KEY),
      true
    );
  } catch (e) { console.warn("App Check activation failed:", e.message); }
}

// Waits for Firebase to restore any existing session first (a real Admin's
// login persists automatically across refreshes). Only falls back to a
// silent Anonymous session if nobody is signed in — this way Firestore Rules
// can always require request.auth != null, for browsing before login too.
let authReadyPromise = firebaseReady
  ? new Promise((resolve) => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try { await auth.signInAnonymously(); }
          catch (e) { firebaseError = "Auth failed: " + e.message; }
        }
        resolve();
      });
    })
  : Promise.resolve();

// ============================================================
// DATA SERVICE — real Firestore calls
// Collections used: admins, candidates (status: pending/approved/rejected), users
// ============================================================
// Avatar color/emoji — gender ના આધારે હંમેશા fresh compute થાય છે, Firestore માં
// stored જૂની value (photoColor/photoEmoji) ક્યારેય નથી વપરાતી. આનાથી future માં
// theme બદલાય તો પણ જૂના candidates ના avatar આપોઆપ નવા રંગમાં દેખાય — કોઈ data
// migration જરૂરી નહીં.
const ADMIN_GUJARAT = "ગુજરાત";
const ADMIN_STATES = ["ગુજરાત","આંધ્ર પ્રદેશ","અરુણાચલ પ્રદેશ","આસામ","બિહાર","છત્તીસગઢ","ગોવા","હરિયાણા","હિમાચલ પ્રદેશ","ઝારખંડ","કર્ણાટક","કેરળ","મધ્ય પ્રદેશ","મહારાષ્ટ્ર","મણિપુર","મેઘાલય","મિઝોરમ","નાગાલેન્ડ","ઓડિશા","પંજાબ","રાજસ્થાન","સિક્કિમ","તમિલનાડુ","તેલંગાણા","ત્રિપુરા","ઉત્તર પ્રદેશ","ઉત્તરાખંડ","પશ્ચિમ બંગાળ","આંદામાન અને નિકોબાર ટાપુઓ","ચંડીગઢ","દાદરા અને નગર હવેલી અને દમણ અને દીવ","દિલ્હી","જમ્મુ અને કાશ્મીર","લદ્દાખ","લક્ષદ્વીપ","પુડુચેરી"];
const ADMIN_AREAS = ["પોરબંદર","વેરાવળ","માંગરોળ","ઓખા","મુંદ્રા","રાજકોટ","અમદાવાદ","દીવ","જામનગર"];

function avatarStyle(c){
  const isFemale = c.gender === "female";
  return {
    color: isFemale ? "linear-gradient(160deg,#D98FA0,#A8455C)" : "linear-gradient(160deg,#A8455C,#4A1220)",
    emoji: isFemale ? "👩" : "👨",
  };
}

// Multiple Photos migration helper — જૂના candidates ને ફક્ત `photoURL` (single-photo
// જમાનાનું) હોય, નવા ને `photos` array — બંને કિસ્સામાં cover photo ની URL આપે.
function primaryPhotoURL(c){
  if (c.photos && c.photos.length > 0) return c.photos[0].url;
  return c.photoURL || null;
}

const adminService = {
  // Firebase Auth requires a real email *format*. To keep the memorable
  // username-style login (e.g. "Agastya_Technext"), we transform anything
  // without an "@" into a fake-but-valid-format address behind the scenes.
  normalizeEmail(input) {
    return input.includes("@") ? input : `${input}@sagarsambandh.local`;
  },

  async login(rawEmail, password) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const email = this.normalizeEmail(rawEmail);

    // Sign in with Firebase Auth — deliberately NO hardcoded master
    // username/password here anymore. An earlier version had
    // "Agastya_Technext"/"Technext@1910" baked directly into this
    // client-side file, which meant anyone opening "View Source" on the
    // live site could read the Super Admin's login and create their own
    // Super Admin session. The very first Admin account must now be
    // created once, manually, in the Firebase Console (Authentication →
    // Add user) — see the setup guide. Whoever signs in with THAT account
    // first, while the `admins` collection is still completely empty, is
    // bootstrapped as Super Admin below (step 2) — no secret password is
    // embedded in this file to do it, and self-registration from this
    // login form is no longer possible at all.
    let cred;
    try {
      cred = await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      throw new Error("ઈમેલ અથવા પાસવર્ડ ખોટા છે");
    }

    // 1. If an admins doc already exists for this uid, log in as that role.
    const adminDoc = await db.collection("admins").doc(cred.user.uid).get();
    if (adminDoc.exists) {
      const data = adminDoc.data();
      return { success: true, id: cred.user.uid, name: data.name, email: data.email, role: data.role };
    }

    // 2. No admins doc for this uid — bootstrap ONLY if the admins
    // collection is genuinely empty (i.e. this really is the very first
    // login ever, right after the account was created in Firebase Console).
    const adminsSnap = await db.collection("admins").limit(1).get();
    if (adminsSnap.empty) {
      await db.collection("admins").doc(cred.user.uid).set({
        name: "Super Admin", email, role: "super",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      return { success: true, id: cred.user.uid, name: "Super Admin", email, role: "super" };
    }

    // Not authorized
    await auth.signOut();
    throw new Error("આ એકાઉન્ટ એડમિન તરીકે રજિસ્ટર નથી. સુપર એડમિન ને કોન્ટેક્ટ કરો.");
  },

  async getAdmins() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const snap = await db.collection("admins").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
  },

  async addAdmin({ name, email, password, role }) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const normalizedEmail = this.normalizeEmail(email);
    // Creating a user via the client SDK normally switches the *current*
    // signed-in session to the new user — undesirable while a Super Admin is
    // mid-session. A temporary secondary Firebase app instance avoids that.
    const secondaryApp = firebase.initializeApp(firebaseConfig, "AdminCreation_" + Date.now());
    try {
      const secondaryAuth = secondaryApp.auth();
      const cred = await secondaryAuth.createUserWithEmailAndPassword(normalizedEmail, password);
      await db.collection("admins").doc(cred.user.uid).set({
        name, email: normalizedEmail, role, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await secondaryAuth.signOut();
      return { id: cred.user.uid };
    } catch (e) {
      if (e.code === "auth/email-already-in-use") throw new Error("આ ઈમેલ થી પહેલેથી એડમિન એકાઉન્ટ છે");
      throw new Error(e.message || "એડમિન એડ ના થયો");
    } finally {
      await secondaryApp.delete();
    }
  },

  async logout() {
    if (auth) await auth.signOut();
  },

  async logActivity(adminEmail, action, targetName) {
    if (!firebaseReady) return;
    try {
      await db.collection("activityLog").add({
        adminEmail, action, targetName, timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch(e) { /* logging failure should never block the main action */ }
  },

  async getActivityLog() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const snap = await db.collection("activityLog").orderBy("timestamp", "desc").limit(50).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async getStats() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const [usersSnap, approvedSnap, pendingSnap] = await Promise.all([
      db.collection("users").get(),
      db.collection("candidates").where("status", "==", "approved").get(),
      db.collection("candidates").where("status", "==", "pending").get(),
    ]);
    return { total: usersSnap.size, approved: approvedSnap.size, pending: pendingSnap.size, reported: 0 };
  },

  async getPending() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const snap = await db.collection("candidates").orderBy("createdAt", "desc").limit(20).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async getAllCandidates() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const snap = await db.collection("candidates").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  // Paginated fetch — one page (default 25) of candidates, optionally
  // filtered by status, newest first. Firestore has no OFFSET/random-access
  // paging, so page-NUMBER navigation only goes as far as "Next" has been
  // clicked — renderAllCandidates keeps a cursor per page it has reached,
  // and clicking an already-visited page number reuses that cursor rather
  // than re-fetching from page 1.
  async getCandidatesPage(status, lastDoc, pageSize) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const size = pageSize || 25;
    let query = db.collection("candidates");
    if (status) query = query.where("status", "==", status);
    query = query.orderBy("createdAt", "desc").limit(size);
    if (lastDoc) query = query.startAfter(lastDoc);
    const snap = await query.get();
    return {
      candidates: snap.docs.map(d => ({ id: d.id, ...d.data() })),
      lastDoc: snap.docs.length ? snap.docs[snap.docs.length - 1] : null,
      hasMore: snap.docs.length === size,
    };
  },

  // Full-fetch — only for the explicit "બધામાં શોધો" search button (honors
  // the active status tab), so its cost is opt-in rather than automatic.
  async searchAllCandidates(status) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    let query = db.collection("candidates");
    if (status) query = query.where("status", "==", status);
    const snap = await query.get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  // Approve થતાં જ sensitive documents (Aadhar/Education/LC) Storage માંથી auto-delete
  // થાય છે — Photo delete નથી થતો (એ member ને કાયમ દેખાડવાનો છે).
  // docsMap = candidate.docs (Review screen પાસે cached data already છે, extra read ટાળવા).
  async approveCandidate(id, docsMap) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const docKeys = ["aadhar", "education", "lc"];
    for (const key of docKeys) {
      if (docsMap && docsMap[key]) {
        try { await storage.ref().child(`candidates/${id}/docs/${key}`).delete(); }
        catch (e) { /* file કદાચ પહેલેથી delete થયેલી હોય — approval ને block ના કરો */ }
      }
    }
    await db.collection("candidates").doc(id).update({
      status: "approved",
      docs: firebase.firestore.FieldValue.delete(),
      documentsDeletedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { success: true };
  },

  async rejectCandidate(id, reason) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    await db.collection("candidates").doc(id).update({ status: "rejected", rejectReason: reason || null });
    return { success: true };
  },

  // Admin Edit — corrects candidate data directly (typos, wrong details).
  // Deliberately does NOT touch `status` — Admin is the approving authority,
  // so an Admin-made edit doesn't need to go back through re-approval like a
  // candidate's own self-edit does.
  async updateCandidateByAdmin(id, payload) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    await db.collection("candidates").doc(id).update(payload);
    return { success: true };
  },

  async getAllUsers() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const snap = await db.collection("users").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  // Paginated fetch — same cursor-per-page pattern as getCandidatesPage.
  async getUsersPage(lastDoc, pageSize) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const size = pageSize || 25;
    let query = db.collection("users").orderBy("createdAt", "desc").limit(size);
    if (lastDoc) query = query.startAfter(lastDoc);
    const snap = await query.get();
    return {
      users: snap.docs.map(d => ({ id: d.id, ...d.data() })),
      lastDoc: snap.docs.length ? snap.docs[snap.docs.length - 1] : null,
      hasMore: snap.docs.length === size,
    };
  },

  async searchAllUsers() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const snap = await db.collection("users").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async toggleBlockUser(userId, blocked) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    await db.collection("users").doc(userId).update({ blocked });
    return { success: true };
  },

  // Analytics — બધું client-side aggregate થાય છે, existing read-access જ વાપરે છે,
  // કોઈ નવો Rules change જરૂરી નથી.
  async getAnalyticsData() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase લોડ ના થયું");
    const [candSnap, interestSnap] = await Promise.all([
      db.collection("candidates").get(),
      db.collection("interests").get(),
    ]);
    const candidates = candSnap.docs.map(d => d.data());
    const interests = interestSnap.docs.map(d => d.data());

    const statusBreakdown = { pending: 0, approved: 0, rejected: 0 };
    candidates.forEach(c => { if (statusBreakdown[c.status] !== undefined) statusBreakdown[c.status]++; });

    // Gender/Age/City — "live marketplace" ને represent કરે એટલે ફક્ત
    // approved & deactivated-not-થયેલા candidates ગણ્યા.
    const live = candidates.filter(c => c.status === "approved" && !c.deactivated);
    const genderSplit = { male: 0, female: 0 };
    live.forEach(c => { if (genderSplit[c.gender] !== undefined) genderSplit[c.gender]++; });

    const ageBuckets = { "18-25": 0, "26-30": 0, "31-35": 0, "36-40": 0, "41+": 0 };
    live.forEach(c => {
      const age = Number(c.age) || 0;
      if (age <= 25) ageBuckets["18-25"]++;
      else if (age <= 30) ageBuckets["26-30"]++;
      else if (age <= 35) ageBuckets["31-35"]++;
      else if (age <= 40) ageBuckets["36-40"]++;
      else if (age > 40) ageBuckets["41+"]++;
    });

    const cityCounts = {};
    live.forEach(c => { const city = (c.city||"").trim(); if (city) cityCounts[city] = (cityCounts[city]||0) + 1; });
    const topCities = Object.entries(cityCounts).sort((a,b) => b[1]-a[1]).slice(0, 5);

    const interestStats = { total: interests.length, pending: 0, accepted: 0, declined: 0 };
    interests.forEach(i => { if (interestStats[i.status] !== undefined) interestStats[i.status]++; });

    return { statusBreakdown, genderSplit, ageBuckets, topCities, interestStats, liveCount: live.length };
  },
};

const root = document.getElementById("root");

// ---- Session restore: relies on Firebase Auth's own persisted session,
// then re-checks the admins collection (server-verified, cannot be forged
// by editing localStorage in DevTools like the old approach could). ----
async function tryRestoreAdminSession(){
  const user = auth.currentUser;
  if (!user || user.isAnonymous) return false;
  try {
    const adminDoc = await db.collection("admins").doc(user.uid).get();
    if (!adminDoc.exists) return false;
    const data = adminDoc.data();
    state.loggedIn = true; state.adminName = data.name; state.adminEmail = data.email; state.adminRole = data.role;
    return true;
  } catch (e) { return false; }
}

function render(){ if(!state.loggedIn){ renderLogin(); return; } renderShell(); }

// XSS-safety helper — every piece of user-supplied text (candidate name,
// city, occupation, member name, document filename, activity-log targetName,
// etc.) that gets inserted into an innerHTML template MUST go through this
// first. Without it, a candidate could submit a name like
// `<img src=x onerror=alert(1)>` and have it execute as real HTML/script the
// moment an Admin opens the Review screen (stored XSS against the Admin).
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function showToast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;

}

function sidebarHtml(active, pendingCount){
  const items=[["dashboard","📊","Dashboard",0],["pending","⏳","Pending Approvals",pendingCount],["allCandidates","📋","All Candidates",0],["members","👥","All Members",0],["reported","🚩","Reported/Blocked",0],["analytics","📈","Analytics",0]];

  items.push(["activityLog","📜","Activity Log",0]);

      <div class="sb-logo"><div class="sb-logo-icon">🤝</div><div class="sb-logo-text">પોરબંદર ખારવા<br>સમાજ Admin</div></div>

function attachSidebar(){
  document.querySelectorAll("[data-snav]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.view = el.getAttribute("data-snav"); render(); });
  });
  const logoutBtn = document.getElementById("sidebar-logout");
  if(logoutBtn){
    logoutBtn.addEventListener("click", async ()=>{
      if(!confirm("શું તમે ખરેખર લોગઆઉટ કરવા માંગો છો?")) return;
      await adminService.logout();
      state.loggedIn=false; state.loginStep=1; state.adminName=""; state.adminEmail=""; state.adminRole="super"; state.view="dashboard";
      render();
    });
  }
}

function renderShell(){
  const active = state.view==="review" ? "pending" : (state.view==="editCandidate" ? state.editReturnView : state.view);
  const pendingCount = state.pendingCache.filter(c=>c.status==="pending").length;
  root.innerHTML = `<div class="app-shell">${sidebarHtml(active,pendingCount)}<div class="main" id="main"></div></div>`;
  attachSidebar();
  const main = document.getElementById("main");
  if(state.view==="dashboard") renderDashboard(main);
  else if(state.view==="review") renderReview(main);
  else if(state.view==="pending"){ state.candidatesFilter="pending"; renderAllCandidates(main, "pending"); }
  else if(state.view==="allCandidates") renderAllCandidates(main);
  else if(state.view==="editCandidate") renderEditCandidate(main);
  else if(state.view==="members") renderMembers(main);
  else if(state.view==="reported") renderReported(main);
  else if(state.view==="analytics") renderAnalytics(main);
  else if(state.view==="manageAdmins") renderManageAdmins(main);
  else if(state.view==="export") renderExport(main);
  else if(state.view==="activityLog") renderActivityLog(main);
}

            ${c.status==="rejected" && c.rejectReason ? `<div class="detail-row"><span class="k">Reject Reason</span><span class="v" style="color:var(--danger);">${escapeHtml(c.rejectReason)}</span></div>` : ""}

              return `<div style="display:flex;gap:8px;flex-wrap:wrap;">${photoList.map(url=>`<img src="${url}" style="width:100px;height:100px;object-fit:cover;border-radius:12px;">`).join("")}</div>`;
            })()}
          </div>
          <div class="card">
            <div class="section-title" style="margin-top:0;">Documents</div>
            ${(() => {
              const docKeys = [["aadhar","🪪 આધાર કાર્ડ"],["education","🎓 શિક્ષણ પ્રમાણપત્ર"],["lc","📄 જન્મ તારીખ દાખલો / LC"]];
              const rows = docKeys.map(([key,label])=>{
                const doc = c.docs && c.docs[key];
                if(doc) return `<div class="doc-item"><div class="doc-thumb">✓</div><div><div class="doc-name">${label}</div><div class="doc-note">${escapeHtml(doc.name||'file')}</div></div><a href="${doc.url}" target="_blank" class="icon-btn ib-download" style="text-decoration:none;">⬇</a></div>`;
                if(c.documentsDeletedAt) return `<div class="doc-item" style="opacity:0.6;"><div class="doc-thumb">🗑️</div><div><div class="doc-name">${label}</div><div class="doc-note">Approve પછી Auto-Delete થયું</div></div></div>`;
                return `<div class="doc-item" style="opacity:0.5;"><div class="doc-thumb">⏳</div><div><div class="doc-name">${label}</div><div class="doc-note">Upload બાકી છે</div></div></div>`;
              }).join("");

            })()}
            <div style="background:#FFF6E7;border:1px solid #F2D8A0;border-radius:12px;padding:11px 13px;margin-top:12px;font-size:11px;color:#8A6116;line-height:1.6;">
              ${c.status==="pending" ? '🔒 Approve કરતાં પહેલા documents Download કરી લો — Approve click કરતાં જ documents Storage માંથી આપોઆપ Delete થઈ જશે (Privacy માટે).' : c.documentsDeletedAt ? '🔒 Documents Approve થયા પછી auto-delete થઈ ગયા — Privacy ના કારણે, હવે Storage માં નથી.' : ''}
            </div>
          </div>
          <div class="action-bar">
            <button class="btn btn-approve" id="r-approve" ${c.status!=="pending"||state.adminRole==='viewer'?"disabled":""}>✓ Approve</button>
            <button class="btn btn-reject" id="r-reject" ${c.status!=="pending"||state.adminRole==='viewer'?"disabled":""}>✕ Reject</button>
          </div>
          ${state.adminRole!=='viewer' ? `<button class="mini-btn" id="r-edit" style="width:100%;margin-top:8px;background:var(--ice);color:var(--primary);">✏️ Details Edit કરો (typo/mistake fix)</button>` : ""}
          ${state.adminRole==='viewer' ? `<div style="font-size:11px;color:var(--text-mid);margin-top:8px;text-align:center;">👁️ Viewer role — ફક્ત જોઈ શકો, actions ના લઈ શકો</div>` : ""}
        </div>
      </div>
    </div>
  `;
  document.getElementById("r-back").addEventListener("click", ()=>{ state.view="dashboard"; render(); });
  const editBtn = document.getElementById("r-edit");
  if(editBtn) editBtn.addEventListener("click", ()=>{
    state.editCandidateData = c;
    state.editReturnView = "review";
    state.view = "editCandidate"; render();
  });
  document.getElementById("r-approve").addEventListener("click", async ()=>{
    document.getElementById("r-approve").disabled=true; document.getElementById("r-reject").disabled=true;
    try{
      await adminService.approveCandidate(c.id, c.docs);
      await adminService.logActivity(state.adminEmail, "Approved candidate", c.name);
      showToast("✓ એપ્રુવ્ડ — સેવ થયું");
      setTimeout(()=>{ state.view="dashboard"; render(); }, 1000);
    }catch(err){ showToast("Error: "+err.message); }
  });
  document.getElementById("r-reject").addEventListener("click", async ()=>{
    const reason = prompt("Reject કરવાનું કારણ લખો (candidate ને ભવિષ્યમાં દેખાડવા માટે record થશે):");
    if(reason === null) return; // admin એ cancel કર્યું
    if(!reason.trim()){ showToast("કારણ લખવું જરૂરી છે"); return; }
    document.getElementById("r-approve").disabled=true; document.getElementById("r-reject").disabled=true;
    try{
      await adminService.rejectCandidate(c.id, reason.trim());
      await adminService.logActivity(state.adminEmail, "Rejected candidate", c.name);
      showToast("✕ રિજેક્ટેડ — સેવ થયું");
      setTimeout(()=>{ state.view="dashboard"; render(); }, 1000);
    }catch(err){ showToast("Error: "+err.message); }
  });
}

        </select></div></div>
        <div class="field"><label>ભાઈ-બહેન ની વિગત (Optional)</label><div class="input-wrap"><input id="ec-sib" value="${escapeHtml(c.siblings||'')}"></div></div>

      </div>
      <div style="background:#FFF6E7;border:1px solid #F2D8A0;border-radius:12px;padding:11px 13px;margin-bottom:16px;font-size:11px;color:#8A6116;line-height:1.6;">

      </div>

        <button class="btn btn-approve" id="ec-save" style="flex:1;">✓ સેવ કરો</button>
        <button class="btn btn-reject" id="ec-cancel" style="flex:1;">Cancel</button>
      </div>
    </div>
  `;
  function goBack(){ state.editCandidateData=null; state.view = state.editReturnView || "allCandidates"; render(); }
  document.getElementById("ec-back").addEventListener("click", goBack);
  document.getElementById("ec-cancel").addEventListener("click", goBack);
  document.getElementById("ec-state").addEventListener("change", (e)=>{
    const isGuj = e.target.value === ADMIN_GUJARAT;
    document.getElementById("ec-area-wrap").style.display = isGuj ? "" : "none";
    document.getElementById("ec-city-wrap").style.display = isGuj ? "none" : "";
  });
  document.getElementById("ec-save").addEventListener("click", async (e)=>{
    const name=document.getElementById("ec-name").value.trim();
    const gender=document.getElementById("ec-gender").value;
    const age=document.getElementById("ec-age").value;
    const fatherName=document.getElementById("ec-father").value.trim();
    const motherName=document.getElementById("ec-mother").value.trim();
    const rashi=document.getElementById("ec-rashi").value;
    const education=document.getElementById("ec-edu").value.trim();
    const occupation=document.getElementById("ec-occ").value.trim();
    const stateVal=document.getElementById("ec-state").value;
    const isGuj = stateVal === ADMIN_GUJARAT;
    const city = isGuj ? document.getElementById("ec-area").value : document.getElementById("ec-city").value.trim();
    const maritalStatus=document.getElementById("ec-status").value;
    const siblings=document.getElementById("ec-sib").value.trim();
    const errEl=document.getElementById("ec-err"); errEl.innerHTML="";
    if(!name||!gender||!age||!fatherName||!motherName||!education||!stateVal||!city){
      errEl.innerHTML = `<div class="err-text">બધા જરૂરી fields ભરો</div>`; return;
    }
    if(Number(age) < 18 || Number(age) > 70 || !Number.isInteger(Number(age))){
      errEl.innerHTML = `<div class="err-text">ઉંમર 18 થી 70 વર્ષ ની વચ્ચે જ હોવી જોઈએ</div>`; return;
    }
    const payload = { name, gender, age:Number(age), fatherName, motherName, rashi, education, occupation, state: stateVal, city, maritalStatus, siblings: siblings||null };
    e.target.disabled=true; e.target.textContent="સેવ થઈ રહ્યું છે...";
    try{
      await adminService.updateCandidateByAdmin(c.id, payload);
      await adminService.logActivity(state.adminEmail, "Edited candidate details", name);
      showToast("✓ કેન્ડિડેટ ની વિગત અપડેટ થઈ");
      if(state.editReturnView==="review"){
        const idx = state.pendingCache.findIndex(x=>x.id===c.id);
        if(idx>-1) Object.assign(state.pendingCache[idx], payload);
      }
      goBack();
    }catch(err){
      e.target.disabled=false; e.target.textContent="✓ Save Changes";
      errEl.innerHTML = `<div class="err-text">${err.message}</div>`;
    }
  });
}

function renderAllCandidates(main, initialStatus){
  const status = initialStatus || state.candidatesFilter || "";
  state.candidatesFilter = status;
  main.innerHTML = `
    <div class="topbar">
      <div><h1>📋 All Candidates</h1><div class="sub">Community ના બધા candidate profiles (Live Firestore data)</div></div>
    </div>
    <div class="panel" style="padding:16px 18px;">
      <div class="input-wrap" style="max-width:340px;margin-bottom:12px;"><input id="ac-search" placeholder="નામ અથવા શહેર થી શોધો..." style="border:none;outline:none;font-family:inherit;font-size:13px;padding:11px 0;width:100%;color:var(--text-dark);"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="chip ac-tab ${status===''?'active':''}" data-status="">બધા</div>
        <div class="chip ac-tab ${status==='pending'?'active':''}" data-status="pending">⏳ Pending</div>
        <div class="chip ac-tab ${status==='approved'?'active':''}" data-status="approved">✓ Approved</div>
        <div class="chip ac-tab ${status==='rejected'?'active':''}" data-status="rejected">✕ Rejected</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Candidates</h2></div>
      <div id="ac-list"><div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div></div>
      <div id="ac-pager" style="display:flex;gap:6px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap;"></div>
    </div>
  `;

  const PAGE_SIZE = 25;
  let currentStatus = status;
  let pageCursors = [null];  // pageCursors[i] = cursor to fetch page i+2 (i.e. index0 unused start marker)
  let currentPage = 1;
  let hasMore = true;
  let currentList = [];
  let searchAllResults = null; // non-null while "બધામાં શોધો" is active

  function rowsHtml(list){
    if(list.length===0) return `<div class="empty">કોઈ candidate ના મળ્યા</div>`;
    return list.map(c=>`
      <div class="approval-row">
        <div class="ar-photo" style="background:${avatarStyle(c).color}">${avatarStyle(c).emoji}</div>
        <div class="ar-info"><div class="ar-name">${escapeHtml(c.name)}${c.deactivated?' <span style="color:var(--text-mid);font-size:10px;font-weight:700;">(Deactivated)</span>':''}</div><div class="ar-meta">${escapeHtml(c.city||'-')} · ${c.age||'-'} વર્ષ</div></div>
        <div class="ar-actions">
          ${c.status==="pending" ? `<button class="btn-view" data-review="${c.id}">Review</button>` : ""}
          ${state.adminRole!=='viewer' ? `<button class="btn-view" data-edit="${c.id}">✏️ એડિટ</button>` : ""}
        </div>
        ${c.status==="approved" ? `<span class="status-badge badge-approved">✓ Approved</span>` : ""}
        ${c.status==="rejected" ? `<span class="status-badge badge-rejected" title="${escapeHtml(c.rejectReason||"")}">✕ Rejected</span>` : ""}
      </div>
    `).join("");
  }

  function attachRowEvents(list){
    document.querySelectorAll("[data-review]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.pendingCache = list;
        state.reviewId = btn.getAttribute("data-review"); state.view="review"; render();
      });
    });
    document.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const candidate = list.find(x=>x.id===btn.getAttribute("data-edit"));
        state.editCandidateData = candidate;
        state.editReturnView = "allCandidates";
        state.view = "editCandidate"; render();
      });
    });
  }

  function clientFilter(list){
    const q = document.getElementById("ac-search").value.trim().toLowerCase();
    if(!q) return list;
    return list.filter(c => (c.name||"").toLowerCase().includes(q) || (c.city||"").toLowerCase().includes(q));
  }

  function paintPager(){
    const pager = document.getElementById("ac-pager");
    if(searchAllResults !== null){ pager.innerHTML = ""; return; }
    const maxReached = pageCursors.length; // pages 1..maxReached have been visited/fetched
    let html = "";
    for(let p=1; p<=maxReached; p++){
      html += `<button class="mini-btn" data-page="${p}" style="min-width:34px;${p===currentPage?'background:var(--navy);color:#fff;':'background:var(--ice);color:var(--primary);'}">${p}</button>`;
    }
    if(hasMore) html += `<button class="mini-btn" id="ac-next-page" style="background:var(--ice);color:var(--primary);">આગળ →</button>`;
    pager.innerHTML = html;
    pager.querySelectorAll("[data-page]").forEach(btn=>{
      btn.addEventListener("click", ()=> goToPage(Number(btn.getAttribute("data-page"))));
    });
    const nextBtn = document.getElementById("ac-next-page");
    if(nextBtn) nextBtn.addEventListener("click", ()=> goToPage(currentPage+1));
  }

  async function goToPage(pageNum){
    const el = document.getElementById("ac-list");
    el.innerHTML = `<div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div>`;
    try{
      const cursor = pageCursors[pageNum-1]; // null for page 1
      const result = await adminService.getCandidatesPage(currentStatus || null, cursor, PAGE_SIZE);
      currentList = result.candidates;
      currentPage = pageNum;
      hasMore = result.hasMore;
      if(pageCursors.length < pageNum + 1) pageCursors[pageNum] = result.lastDoc;
      const filtered = clientFilter(currentList);
      el.innerHTML = rowsHtml(filtered);
      attachRowEvents(currentList);
      paintPager();
    }catch(err){
      el.innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;
    }
  }

  async function doSearchAll(){
    const el = document.getElementById("ac-list");
    el.innerHTML = `<div style="padding:20px;color:var(--text-mid);font-size:13px;">બધામાં શોધી રહ્યા છીએ...</div>`;
    try{
      searchAllResults = await adminService.searchAllCandidates(currentStatus || null);
      const filtered = clientFilter(searchAllResults);
      el.innerHTML = rowsHtml(filtered) + `<div id="ac-clear-search" style="text-align:center;padding:12px;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;">← Pagination પર પાછા જાવ</div>`;
      attachRowEvents(searchAllResults);
      document.getElementById("ac-clear-search").addEventListener("click", ()=>{ searchAllResults=null; goToPage(1); });
      paintPager();
    }catch(err){
      el.innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;
    }
  }

  document.querySelectorAll(".ac-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".ac-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      currentStatus = tab.getAttribute("data-status");
      state.candidatesFilter = currentStatus;
      pageCursors = [null]; searchAllResults = null;
      goToPage(1);
    });
  });
  document.getElementById("ac-search").addEventListener("input", ()=>{
    const source = searchAllResults !== null ? searchAllResults : currentList;
    const filtered = clientFilter(source);
    const el = document.getElementById("ac-list");
    const q = document.getElementById("ac-search").value.trim();
    el.innerHTML = rowsHtml(filtered) + (q && searchAllResults===null ? `<div id="ac-search-all-btn" style="text-align:center;padding:12px;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;">🔍 બધા candidates માં "${escapeHtml(q)}" શોધો</div>` : (searchAllResults!==null ? `<div id="ac-clear-search" style="text-align:center;padding:12px;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;">← Pagination પર પાછા જાવ</div>` : ""));
    attachRowEvents(source);
    if(document.getElementById("ac-search-all-btn")) document.getElementById("ac-search-all-btn").addEventListener("click", doSearchAll);
    if(document.getElementById("ac-clear-search")) document.getElementById("ac-clear-search").addEventListener("click", ()=>{ searchAllResults=null; goToPage(1); });
  });

  goToPage(1);
}

    </div>
    <div class="panel">
      <div class="panel-head"><h2>Members</h2></div>
      <div id="members-list"><div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div></div>
      <div id="m-pager" style="display:flex;gap:6px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap;"></div>
    </div>
  `;

  const PAGE_SIZE = 25;
  let pageCursors = [null];
  let currentPage = 1;
  let hasMore = true;
  let currentList = [];
  let searchAllResults = null;

  function rowsHtml(list){
    if(list.length===0) return `<div class="empty">કોઈ member ના મળ્યા</div>`;
    return list.map(u=>`
      <div class="approval-row">
        <div class="ar-photo" style="background:linear-gradient(160deg,#D98FA0,#A8455C);">👤</div>
        <div class="ar-info">
          <div class="ar-name">${escapeHtml(u.name)}${u.blocked?' <span style="color:var(--danger);font-size:10px;font-weight:800;">(BLOCKED)</span>':''}</div>
          <div class="ar-meta">${escapeHtml(u.mobile)} · ${escapeHtml(u.village||'-')}</div>
        </div>
        <div class="ar-actions">
          ${state.adminRole!=='viewer' ? `
          <button class="btn-view" data-toggle-block="${u.id}" data-blocked="${u.blocked?'1':'0'}" style="${u.blocked?'background:#E7F6EF;color:var(--success);':'background:#FCEBEA;color:var(--danger);'}">
            ${u.blocked ? 'Unblock' : 'Block'}
          </button>` : `<span style="font-size:10.5px;color:var(--text-mid);">👁️ View only</span>`}
        </div>
      </div>
    `).join("");
  }

  function attachRowEvents(list){
    document.querySelectorAll("[data-toggle-block]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const userId = btn.getAttribute("data-toggle-block");
        const currentlyBlocked = btn.getAttribute("data-blocked")==="1";
        btn.disabled = true;
        try{
          await adminService.toggleBlockUser(userId, !currentlyBlocked);
          const u = list.find(x=>x.id===userId);
          await adminService.logActivity(state.adminEmail, currentlyBlocked ? "Unblocked member" : "Blocked member", u ? u.name : userId);
          showToast(currentlyBlocked ? "✓ અનબ્લોક કર્યું" : "🚫 બ્લોક કર્યું");
          if(u) u.blocked = !currentlyBlocked;
          const el = document.getElementById("members-list");
          el.innerHTML = rowsHtml(clientFilter(list));
          attachRowEvents(list);
        }catch(err){ showToast("Error: "+err.message); btn.disabled=false; }
      });
    });
  }

  function clientFilter(list){
    const q = document.getElementById("m-search").value.trim().toLowerCase();
    if(!q) return list;
    return list.filter(u => (u.name||"").toLowerCase().includes(q) || (u.mobile||"").includes(q));
  }

  function paintPager(){
    const pager = document.getElementById("m-pager");
    if(searchAllResults !== null){ pager.innerHTML = ""; return; }
    const maxReached = pageCursors.length;
    let html = "";
    for(let p=1; p<=maxReached; p++){
      html += `<button class="mini-btn" data-page="${p}" style="min-width:34px;${p===currentPage?'background:var(--navy);color:#fff;':'background:var(--ice);color:var(--primary);'}">${p}</button>`;
    }
    if(hasMore) html += `<button class="mini-btn" id="m-next-page" style="background:var(--ice);color:var(--primary);">આગળ →</button>`;
    pager.innerHTML = html;
    pager.querySelectorAll("[data-page]").forEach(btn=>{
      btn.addEventListener("click", ()=> goToPage(Number(btn.getAttribute("data-page"))));
    });
    const nextBtn = document.getElementById("m-next-page");
    if(nextBtn) nextBtn.addEventListener("click", ()=> goToPage(currentPage+1));
  }

  async function goToPage(pageNum){
    const el = document.getElementById("members-list");
    el.innerHTML = `<div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div>`;
    try{
      const cursor = pageCursors[pageNum-1];
      const result = await adminService.getUsersPage(cursor, PAGE_SIZE);
      currentList = result.users;
      currentPage = pageNum;
      hasMore = result.hasMore;
      if(pageCursors.length < pageNum + 1) pageCursors[pageNum] = result.lastDoc;
      el.innerHTML = rowsHtml(clientFilter(currentList));
      attachRowEvents(currentList);
      paintPager();
    }catch(err){
      el.innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;
    }
  }

  async function doSearchAll(){
    const el = document.getElementById("members-list");
    el.innerHTML = `<div style="padding:20px;color:var(--text-mid);font-size:13px;">બધામાં શોધી રહ્યા છીએ...</div>`;
    try{
      searchAllResults = await adminService.searchAllUsers();
      el.innerHTML = rowsHtml(clientFilter(searchAllResults)) + `<div id="m-clear-search" style="text-align:center;padding:12px;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;">← Pagination પર પાછા જાવ</div>`;
      attachRowEvents(searchAllResults);
      document.getElementById("m-clear-search").addEventListener("click", ()=>{ searchAllResults=null; goToPage(1); });
      paintPager();
    }catch(err){
      el.innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;
    }
  }

  document.getElementById("m-search").addEventListener("input", ()=>{
    const source = searchAllResults !== null ? searchAllResults : currentList;
    const filtered = clientFilter(source);
    const el = document.getElementById("members-list");
    const q = document.getElementById("m-search").value.trim();
    el.innerHTML = rowsHtml(filtered) + (q && searchAllResults===null ? `<div id="m-search-all-btn" style="text-align:center;padding:12px;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;">🔍 બધા members માં "${escapeHtml(q)}" શોધો</div>` : (searchAllResults!==null ? `<div id="m-clear-search" style="text-align:center;padding:12px;color:var(--primary);font-weight:700;font-size:12px;cursor:pointer;">← Pagination પર પાછા જાવ</div>` : ""));
    attachRowEvents(source);
    if(document.getElementById("m-search-all-btn")) document.getElementById("m-search-all-btn").addEventListener("click", doSearchAll);
    if(document.getElementById("m-clear-search")) document.getElementById("m-clear-search").addEventListener("click", ()=>{ searchAllResults=null; goToPage(1); });
  });

  goToPage(1);
}

function renderAnalytics(main){
  main.innerHTML = `
    <div class="topbar"><div><h1>📈 Analytics</h1><div class="sub">Community profiles ના overview stats (Live Firestore data)</div></div></div>
    <div id="analytics-content"><div class="placeholder">Load થઈ રહ્યું છે...</div></div>
  `;
  function barsHtml(title, dataObj, colorKeyed){
    const total = Object.values(dataObj).reduce((a,b)=>a+b,0) || 1;
    return `
      <div class="panel" style="padding:18px;">
        <div class="panel-head" style="padding:0 0 14px;border:none;"><h2>${title}</h2></div>
        ${Object.entries(dataObj).map(([k,v])=>`
          <div class="abar-row">
            <div class="abar-label"><span>${k}</span><span>${v} (${Math.round(v/total*100)}%)</span></div>
            <div class="abar-track"><div class="abar-fill" style="width:${Math.round(v/total*100)}%;"></div></div>
          </div>
        `).join("")}
      </div>
    `;
  }
  adminService.getAnalyticsData().then(data=>{
    const el = document.getElementById("analytics-content");
    const genderLabels = { male: "યુવક (Male)", female: "યુવતી (Female)" };
    const genderData = {}; Object.entries(data.genderSplit).forEach(([k,v])=>{ genderData[genderLabels[k]||k]=v; });
    const statusLabels = { pending: "⏳ Pending", approved: "✓ Approved", rejected: "✕ Rejected" };
    const statusData = {}; Object.entries(data.statusBreakdown).forEach(([k,v])=>{ statusData[statusLabels[k]||k]=v; });
    const interestLabels = { pending: "⏳ Pending", accepted: "✓ Accepted", declined: "✕ Declined" };
    const interestData = {}; Object.entries(data.interestStats).forEach(([k,v])=>{ if(k!=="total") interestData[interestLabels[k]||k]=v; });
    const cityData = {}; data.topCities.forEach(([city,count])=>{ cityData[city]=count; });

    el.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon" style="background:var(--ice);color:var(--primary);">✓</div><div class="stat-val">${data.liveCount}</div><div class="stat-label">Live Profiles</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#FDF1E7;color:#B4762A;">⏳</div><div class="stat-val">${data.statusBreakdown.pending}</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#E7F6EF;color:var(--success);">💌</div><div class="stat-val">${data.interestStats.total}</div><div class="stat-label">Total Interests</div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#E7F6EF;color:var(--success);">💞</div><div class="stat-val">${data.interestStats.accepted}</div><div class="stat-label">Interests Accepted</div></div>
      </div>
      <div class="analytics-grid">
        ${barsHtml("Gender Split (Live Profiles)", genderData)}
        ${barsHtml("Status Breakdown (બધા Candidates)", statusData)}
        ${barsHtml("Age Group (Live Profiles)", data.ageBuckets)}
        ${data.topCities.length>0 ? barsHtml("Top Cities (Live Profiles)", cityData) : `<div class="panel" style="padding:18px;"><div class="empty">હજુ કોઈ city data નથી</div></div>`}
        ${barsHtml("Interest Status", interestData)}
      </div>
    `;
  }).catch(err=>{
    document.getElementById("analytics-content").innerHTML = `<div class="status-banner status-err">Data load ના થયું: ${err.message}</div>`;
  });
}

  main.innerHTML = `

    <div class="panel" style="padding:18px;">
      <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:12px;">નવો Admin Add કરો</div>

        <div><label style="display:block;font-size:11px;font-weight:600;color:var(--text-dark);margin-bottom:5px;">Role</label><div class="input-wrap"><select id="na-role" style="border:none;outline:none;padding:10px 0;font-size:13px;width:100%;font-family:inherit;background:transparent;">

    </div>
  `;
  function loadList(){
    adminService.getAdmins().then(list=>{
      document.getElementById("admins-list").innerHTML = list.map(a=>`
        <div class="approval-row">
          <div class="ar-photo" style="background:linear-gradient(160deg,#D98FA0,#A8455C);">👤</div>
          <div class="ar-info"><div class="ar-name">${escapeHtml(a.name)}</div><div class="ar-meta">${escapeHtml(a.email)}</div></div>
          <span class="status-badge ${a.role==='super'?'badge-approved':'badge-rejected'}" style="${a.role!=='super'?'background:var(--ice);color:var(--primary);':''}">${a.role==='super'?'Super Admin':a.role==='staff'?'Staff Admin':'Viewer Admin'}</span>

  loadList();
  document.getElementById("na-submit").addEventListener("click", async (e)=>{

function renderExport(main){
  main.innerHTML = `
    <div class="topbar"><div><h1>📤 Export Data</h1><div class="sub">CSV file માં data download કરો (Excel માં ખૂલી શકે)</div></div></div>
    <div class="panel" style="padding:18px;">
      <div class="quick-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
        <div class="quick-card" id="exp-members" style="cursor:pointer;"><div class="quick-icon">👥</div><div class="quick-label">All Members Export</div></div>
        <div class="quick-card" id="exp-candidates" style="cursor:pointer;"><div class="quick-icon">📋</div><div class="quick-label">All Candidates Export</div></div>
      </div>
    </div>
  `;
  function downloadCSV(filename, rows){
    const csv = rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }
  document.getElementById("exp-members").addEventListener("click", async ()=>{
    try{
      const users = await adminService.getAllUsers();
      const rows = [["Name","Mobile","Village","Blocked"], ...users.map(u=>[u.name,u.mobile,u.village||"",u.blocked?"Yes":"No"])];
      downloadCSV("members.csv", rows);
      await adminService.logActivity(state.adminEmail, "Exported data", "All Members");
      showToast("✓ ડાઉનલોડ શરૂ થયું");
    }catch(err){ showToast("Error: "+err.message); }
  });
  document.getElementById("exp-candidates").addEventListener("click", async ()=>{
    try{
      const candidates = await adminService.getAllCandidates();
      const rows = [["Name","Gender","Age","City","Education","Status"], ...candidates.map(c=>[c.name,c.gender||"",c.age||"",c.city||"",c.education||"",c.status])];
      downloadCSV("candidates.csv", rows);
      await adminService.logActivity(state.adminEmail, "Exported data", "All Candidates");
      showToast("✓ ડાઉનલોડ શરૂ થયું");
    }catch(err){ showToast("Error: "+err.message); }
  });
}

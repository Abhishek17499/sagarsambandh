<script>
// ============================================================
// FIREBASE SETUP
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDeGx5aNtf8aPRviA4rYfdM0Nc65F_35is",
  authDomain: "sagar-sambandh.firebaseapp.com",
  projectId: "sagar-sambandh",
  storageBucket: "sagar-sambandh.firebasestorage.app",
  messagingSenderId: "822553770547",
  appId: "1:822553770547:web:ffb69be461f4a38d5d8146",
};
let db = null, auth = null, firebaseReady = false, firebaseError = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  firebaseReady = true;
} catch (e) { firebaseError = e.message; }

// App Check — verifies requests come from this real website, not a
// copy-pasted config used in someone else's script/page. Team must replace
// RECAPTCHA_V3_SITE_KEY below with the real key from Firebase Console
// (Build → App Check → register a reCAPTCHA v3 site). Wrapped in try/catch
// so a missing/placeholder key never breaks the rest of the app.
const RECAPTCHA_V3_SITE_KEY = "REPLACE_WITH_RECAPTCHA_V3_SITE_KEY";
if (firebaseReady && RECAPTCHA_V3_SITE_KEY !== "REPLACE_WITH_RECAPTCHA_V3_SITE_KEY") {
  try {
    firebase.appCheck().activate(
      new firebase.appCheck.ReCaptchaV3Provider(RECAPTCHA_V3_SITE_KEY),
      true
    );
  } catch (e) { console.warn("App Check activation failed:", e.message); }
}

// Waits for Firebase to restore any existing session first (a real Admin's
// login persists automatically across refreshes). Only falls back to a
// silent Anonymous session if nobody is signed in — this way Firestore Rules
// can always require request.auth != null, for browsing before login too.
let authReadyPromise = firebaseReady
  ? new Promise((resolve) => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try { await auth.signInAnonymously(); }
          catch (e) { firebaseError = "Auth failed: " + e.message; }
        }
        resolve();
      });
    })
  : Promise.resolve();

// Password hashing — browser's built-in Web Crypto API, no external library.
async function sha256(text){
  const data = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// ============================================================
// DATA SERVICE — real Firestore calls
// Collections used: admins, candidates (status: pending/approved/rejected), users
// ============================================================
const PHOTO_STYLES = [
  {color:"linear-gradient(160deg,#7FC7E0,#1C93C9)", emoji:"👩"},
  {color:"linear-gradient(160deg,#1C93C9,#0C2A46)", emoji:"👨"},
  {color:"linear-gradient(160deg,#7FC7E0,#145C82)", emoji:"👩"},
];
function styleFor(i){ return PHOTO_STYLES[i % PHOTO_STYLES.length]; }

const adminService = {
  // Firebase Auth requires a real email *format*. To keep the memorable
  // username-style login (e.g. "Agastya_Technext"), we transform anything
  // without an "@" into a fake-but-valid-format address behind the scenes.
  normalizeEmail(input) {
    return input.includes("@") ? input : `${input}@sagarsambandh.local`;
  },

  async login(rawEmail, password) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const email = this.normalizeEmail(rawEmail);

    const SUPER_ADMIN_EMAIL = "Agastya_Technext";
    const SUPER_ADMIN_PASSWORD = "Technext@1910";

    const adminsSnap = await db.collection("admins").limit(1).get();

    if (adminsSnap.empty) {
      // Bootstrap: only these exact credentials can create the very first Super Admin.
      if (rawEmail !== SUPER_ADMIN_EMAIL || password !== SUPER_ADMIN_PASSWORD) {
        throw new Error("Email અથવા Password ખોટા છે");
      }
      let cred;
      try {
        cred = await auth.createUserWithEmailAndPassword(email, password);
      } catch (err) {
        if (err.code === "auth/email-already-in-use") {
          cred = await auth.signInWithEmailAndPassword(email, password);
        } else {
          throw err;
        }
      }
      await db.collection("admins").doc(cred.user.uid).set({
        name: "Super Admin", email, role: "super",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      return { success: true, id: cred.user.uid, name: "Super Admin", email, role: "super" };
    }

    let cred;
    try {
      cred = await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      throw new Error("Email અથવા Password ખોટા છે");
    }
    const adminDoc = await db.collection("admins").doc(cred.user.uid).get();
    if (!adminDoc.exists) {
      await auth.signOut();
      throw new Error("આ account Admin તરીકે register નથી. Super Admin ને contact કરો.");
    }
    const data = adminDoc.data();
    return { success: true, id: cred.user.uid, name: data.name, email: data.email, role: data.role };
  },

  async getAdmins() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("admins").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
  },

  async addAdmin({ name, email, password, role }) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const normalizedEmail = this.normalizeEmail(email);
    // Creating a user via the client SDK normally switches the *current*
    // signed-in session to the new user — undesirable while a Super Admin is
    // mid-session. A temporary secondary Firebase app instance avoids that.
    const secondaryApp = firebase.initializeApp(firebaseConfig, "AdminCreation_" + Date.now());
    try {
      const secondaryAuth = secondaryApp.auth();
      const cred = await secondaryAuth.createUserWithEmailAndPassword(normalizedEmail, password);
      await db.collection("admins").doc(cred.user.uid).set({
        name, email: normalizedEmail, role, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await secondaryAuth.signOut();
      return { id: cred.user.uid };
    } catch (e) {
      if (e.code === "auth/email-already-in-use") throw new Error("આ email થી પહેલેથી Admin account છે");
      throw new Error(e.message || "Admin add ના થયો");
    } finally {
      await secondaryApp.delete();
    }
  },

  async logout() {
    if (auth) await auth.signOut();
  },

  async logActivity(adminEmail, action, targetName) {
    if (!firebaseReady) return;
    try {
      await db.collection("activityLog").add({
        adminEmail, action, targetName, timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch(e) { /* logging failure should never block the main action */ }
  },

  async getActivityLog() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("activityLog").orderBy("timestamp", "desc").limit(50).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async getStats() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const [usersSnap, approvedSnap, pendingSnap] = await Promise.all([
      db.collection("users").get(),
      db.collection("candidates").where("status", "==", "approved").get(),
      db.collection("candidates").where("status", "==", "pending").get(),
    ]);
    return { total: usersSnap.size, approved: approvedSnap.size, pending: pendingSnap.size, reported: 0 };
  },

  async getPending() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("candidates").orderBy("createdAt", "desc").limit(20).get();
    return snap.docs.map((d, i) => {
      const data = d.data();
      const style = data.photoEmoji ? { color: data.photoColor, emoji: data.photoEmoji } : styleFor(i);
      return { id: d.id, ...data, photoColor: style.color, photoEmoji: style.emoji };
    });
  },

  async getAllCandidates() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("candidates").get();
    return snap.docs.map((d, i) => {
      const data = d.data();
      const style = data.photoEmoji ? { color: data.photoColor, emoji: data.photoEmoji } : styleFor(i);
      return { id: d.id, ...data, photoColor: style.color, photoEmoji: style.emoji };
    }).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  async approveCandidate(id) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("candidates").doc(id).update({ status: "approved" });
    return { success: true };
  },

  async rejectCandidate(id) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("candidates").doc(id).update({ status: "rejected" });
    return { success: true };
  },

  async getAllUsers() {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("users").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  async toggleBlockUser(userId, blocked) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("users").doc(userId).update({ blocked });
    return { success: true };
  },
};

const root = document.getElementById("root");
let state = { loggedIn:false, loginStep:1, adminName:"", adminEmail:"", adminRole:"super", view:"dashboard", reviewId:null, pendingCache:[], candidatesFilter:"" };

// ---- Session restore: relies on Firebase Auth's own persisted session,
// then re-checks the admins collection (server-verified, cannot be forged
// by editing localStorage in DevTools like the old approach could). ----
async function tryRestoreAdminSession(){
  const user = auth.currentUser;
  if (!user || user.isAnonymous) return false;
  try {
    const adminDoc = await db.collection("admins").doc(user.uid).get();
    if (!adminDoc.exists) return false;
    const data = adminDoc.data();
    state.loggedIn = true; state.adminName = data.name; state.adminEmail = data.email; state.adminRole = data.role;
    return true;
  } catch (e) { return false; }
}

function render(){ if(!state.loggedIn){ renderLogin(); return; } renderShell(); }

function showToast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

function renderLogin(){
  root.innerHTML = `
    <div class="login-screen">

        <div class="headline">Community ના profiles ને secure રીતે manage કરો</div>
        <div class="subtext">Candidate approvals, document verification, member management — બધું એક જગ્યાએ.</div>
      </div>
      <div class="right-panel">

          <div class="role-tag">🛡️ Super Admin Login</div>

          <div class="field"><label>Password</label><div class="input-wrap"><input id="l-pass" type="password" placeholder="••••••••"></div></div>
          <div id="l-err"></div>
          <button class="btn btn-primary" id="l-submit">Login કરો →</button>
          <div class="demo-note">Real Login: Registered Admin ના Email/Password જ કામ કરશે — OTP/2FA આગળના phase માં ઉમેરાશે. Dashboard નું data ખરેખર live Firestore માંથી આવે છે.</div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("l-submit").addEventListener("click", async (e)=>{
    const email=document.getElementById("l-email").value.trim();
    const pass=document.getElementById("l-pass").value.trim();
    const errEl=document.getElementById("l-err"); errEl.innerHTML="";
    e.target.disabled=true; e.target.textContent="Checking...";
    try{
      await authReadyPromise;
      if(firebaseError) throw new Error(firebaseError);
      const r = await adminService.login(email,pass);
      state.loggedIn=true; state.adminName=r.name; state.adminEmail=r.email; state.adminRole=r.role; render();
    }catch(err){
      e.target.disabled=false; e.target.textContent="Login કરો →";
      errEl.innerHTML = `<div class="err-text">${err.message}</div>`;
    }
  });
}

function sidebarHtml(active, pendingCount){
  const items=[["dashboard","📊","Dashboard",0],["pending","⏳","Pending Approvals",pendingCount],["allCandidates","📋","All Candidates",0],["members","👥","All Members",0],["reported","🚩","Reported/Blocked",0]];
  if(state.adminRole==="super") items.push(["manageAdmins","🛡️","Manage Admins",0]);
  if(state.adminRole!=="viewer") items.push(["export","📤","Export Data",0]);
  items.push(["activityLog","📜","Activity Log",0]);
  return `
    <div class="sidebar">
      <div class="sb-logo"><div class="sb-logo-icon">🤝</div><div class="sb-logo-text">પોરબંદર ખારવા<br>સમાજ Admin</div></div>
      ${items.map(([k,icon,label,count])=>`
        <div class="nav-item ${active===k?'active':''}" data-snav="${k}"><span>${icon}</span>${label}${count>0?`<span class="nav-count">${count}</span>`:""}</div>
      `).join("")}
      <div style="margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.15); font-size:10.5px; color:rgba(255,255,255,0.6);">
        Logged in as<br><b style="color:#fff;">${state.adminName}</b> (${state.adminRole==='super'?'Super Admin':state.adminRole==='staff'?'Staff Admin':'Viewer Admin'})
      </div>
      <div class="nav-item" id="sidebar-logout" style="margin-top:10px; background:rgba(216,84,74,0.18); color:#fff;"><span>🚪</span>Logout</div>
    </div>
  `;
}

function attachSidebar(){
  document.querySelectorAll("[data-snav]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.view = el.getAttribute("data-snav"); render(); });
  });
  const logoutBtn = document.getElementById("sidebar-logout");
  if(logoutBtn){
    logoutBtn.addEventListener("click", async ()=>{
      if(!confirm("શું તમે ખરેખર Logout કરવા માંગો છો?")) return;
      await adminService.logout();
      state.loggedIn=false; state.loginStep=1; state.adminName=""; state.adminEmail=""; state.adminRole="super"; state.view="dashboard";
      render();
    });
  }
}

function renderShell(){
  const active = state.view==="review" ? "pending" : state.view;
  const pendingCount = state.pendingCache.filter(c=>c.status==="pending").length;
  root.innerHTML = `<div class="app-shell">${sidebarHtml(active,pendingCount)}<div class="main" id="main"></div></div>`;
  attachSidebar();
  const main = document.getElementById("main");
  if(state.view==="dashboard") renderDashboard(main);
  else if(state.view==="review") renderReview(main);
  else if(state.view==="pending"){ state.candidatesFilter="pending"; renderAllCandidates(main, "pending"); }
  else if(state.view==="allCandidates") renderAllCandidates(main);
  else if(state.view==="members") renderMembers(main);
  else if(state.view==="reported") renderReported(main);
  else if(state.view==="manageAdmins") renderManageAdmins(main);
  else if(state.view==="export") renderExport(main);
  else if(state.view==="activityLog") renderActivityLog(main);
}

      <div class="admin-chip"><div class="avatar">${(state.adminName||'A').slice(0,2).toUpperCase()}</div>Super Admin</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Pending Approvals</h2></div>
      <div id="pending-list"><div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div></div>
    </div>
  `;
  adminService.getStats().then(stats=>{
    document.getElementById("stats-grid").innerHTML = `

      <div class="stat-card" data-stat-nav="pending" style="cursor:pointer;"><div class="stat-icon" style="background:#FDF1E7;color:#B4762A;">⏳</div><div class="stat-val">${stats.pending}</div><div class="stat-label">Pending Approvals</div></div>
      <div class="stat-card" data-stat-nav="approved" style="cursor:pointer;"><div class="stat-icon" style="background:#E7F6EF;color:var(--success);">✓</div><div class="stat-val">${stats.approved}</div><div class="stat-label">Approved Profiles</div></div>
      <div class="stat-card" data-stat-nav="reported" style="cursor:pointer;"><div class="stat-icon" style="background:#FCEBEA;color:var(--danger);">🚩</div><div class="stat-val">${stats.reported}</div><div class="stat-label">Reported Accounts</div></div>
    `;
    document.getElementById("stats-grid").addEventListener("click", (e)=>{
      const card = e.target.closest("[data-stat-nav]");
      if(!card) return;
      const target = card.getAttribute("data-stat-nav");
      if(target==="members"){ state.view="members"; render(); }
      else if(target==="pending"){ state.candidatesFilter="pending"; state.view="allCandidates"; render(); }
      else if(target==="approved"){ state.candidatesFilter="approved"; state.view="allCandidates"; render(); }
      else if(target==="reported"){ state.view="reported"; render(); }
    });
  }).catch(err=>{
    document.getElementById("stats-grid").innerHTML = `<div style="grid-column:1/-1;" class="status-banner status-err">Stats load ના થયા: ${err.message}</div>`;
  });

  adminService.getPending().then(list=>{
    state.pendingCache = list;
    const el = document.getElementById("pending-list");
    if(list.length===0){ el.innerHTML = `<div class="empty">હજુ કોઈ candidate submit નથી થયું</div>`; return; }
    el.innerHTML = list.map(c=>`
      <div class="approval-row">
        <div class="ar-photo" style="background:${c.photoColor}">${c.photoEmoji}</div>
        <div class="ar-info"><div class="ar-name">${c.name}</div><div class="ar-meta">${c.city||'-'} · ${c.status}</div></div>
        ${c.status==="pending" ? `<div class="ar-actions"><button class="btn-view" data-review="${c.id}">Review</button></div>` : ""}
        ${c.status==="approved" ? `<span class="status-badge badge-approved">✓ Approved</span>` : ""}
        ${c.status==="rejected" ? `<span class="status-badge badge-rejected">✕ Rejected</span>` : ""}
      </div>
    `).join("");
    document.querySelectorAll("[data-review]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.reviewId = btn.getAttribute("data-review"); state.view="review"; render(); });
    });
    // refresh sidebar count now that we know pending count
    attachSidebar();
    const sbCount = list.filter(c=>c.status==="pending").length;
    const countEl = document.querySelector('[data-snav="pending"] .nav-count');
    if(sbCount>0 && !countEl){
      const navEl = document.querySelector('[data-snav="pending"]');

    document.getElementById("pending-list").innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;

function renderAllCandidates(main, initialStatus){
  const status = initialStatus || state.candidatesFilter || "";
  state.candidatesFilter = status;
  main.innerHTML = `
    <div class="topbar">
      <div><h1>📋 All Candidates</h1><div class="sub">Community ના બધા candidate profiles (Live Firestore data)</div></div>
    </div>
    <div class="panel" style="padding:16px 18px;">
      <div class="input-wrap" style="max-width:340px;margin-bottom:12px;"><input id="ac-search" placeholder="નામ અથવા શહેર થી શોધો..." style="border:none;outline:none;font-family:inherit;font-size:13px;padding:11px 0;width:100%;color:var(--text-dark);"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <div class="chip ac-tab ${status===''?'active':''}" data-status="">બધા</div>
        <div class="chip ac-tab ${status==='pending'?'active':''}" data-status="pending">⏳ Pending</div>
        <div class="chip ac-tab ${status==='approved'?'active':''}" data-status="approved">✓ Approved</div>
        <div class="chip ac-tab ${status==='rejected'?'active':''}" data-status="rejected">✕ Rejected</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Candidates</h2></div>
      <div id="ac-list"><div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div></div>
    </div>
  `;

  let allCandidates = [];
  function paint(){
    const q = document.getElementById("ac-search").value.trim().toLowerCase();
    let list = allCandidates;
    if(state.candidatesFilter) list = list.filter(c=>c.status===state.candidatesFilter);
    if(q) list = list.filter(c => (c.name||"").toLowerCase().includes(q) || (c.city||"").toLowerCase().includes(q));
    const el = document.getElementById("ac-list");
    if(list.length===0){ el.innerHTML = `<div class="empty">કોઈ candidate ના મળ્યા</div>`; return; }
    el.innerHTML = list.map(c=>`
      <div class="approval-row">
        <div class="ar-photo" style="background:${c.photoColor}">${c.photoEmoji}</div>
        <div class="ar-info"><div class="ar-name">${c.name}${c.deactivated?' <span style="color:var(--text-mid);font-size:10px;font-weight:700;">(Deactivated)</span>':''}</div><div class="ar-meta">${c.city||'-'} · ${c.age||'-'} વર્ષ</div></div>
        ${c.status==="pending" ? `<div class="ar-actions"><button class="btn-view" data-review="${c.id}">Review</button></div>` : ""}
        ${c.status==="approved" ? `<span class="status-badge badge-approved">✓ Approved</span>` : ""}
        ${c.status==="rejected" ? `<span class="status-badge badge-rejected">✕ Rejected</span>` : ""}
      </div>
    `).join("");
    document.querySelectorAll("[data-review]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.pendingCache = allCandidates;
        state.reviewId = btn.getAttribute("data-review"); state.view="review"; render();
      });
    });
  }

  document.querySelectorAll(".ac-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".ac-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      state.candidatesFilter = tab.getAttribute("data-status");
      paint();
    });
  });
  document.getElementById("ac-search").addEventListener("input", paint);

  adminService.getAllCandidates().then(list=>{
    allCandidates = list;
    paint();
  }).catch(err=>{
    document.getElementById("ac-list").innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;
  });
}

function renderMembers(main){
  main.innerHTML = `
    <div class="topbar">
      <div><h1>👥 All Members</h1><div class="sub">Community ના બધા registered members (Live Firestore data)</div></div>
    </div>
    <div class="panel" style="padding:16px 18px;">

    </div>
    <div class="panel">
      <div class="panel-head"><h2>Members</h2></div>
      <div id="members-list"><div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div></div>
    </div>
  `;

  let allUsers = [];
  function paint(list){
    const el = document.getElementById("members-list");
    if(!el) return;
    if(list.length===0){ el.innerHTML = `<div class="empty">કોઈ member ના મળ્યા</div>`; return; }
    el.innerHTML = list.map(u=>`
      <div class="approval-row">
        <div class="ar-photo" style="background:linear-gradient(160deg,#7FC7E0,#1C93C9);">👤</div>
        <div class="ar-info">
          <div class="ar-name">${u.name}${u.blocked?' <span style="color:var(--danger);font-size:10px;font-weight:800;">(BLOCKED)</span>':''}</div>
          <div class="ar-meta">${u.mobile} · ${u.village||'-'}</div>
        </div>
        <div class="ar-actions">
          ${state.adminRole!=='viewer' ? `
          <button class="btn-view" data-toggle-block="${u.id}" data-blocked="${u.blocked?'1':'0'}" style="${u.blocked?'background:#E7F6EF;color:var(--success);':'background:#FCEBEA;color:var(--danger);'}">
            ${u.blocked ? 'Unblock' : 'Block'}
          </button>` : `<span style="font-size:10.5px;color:var(--text-mid);">👁️ View only</span>`}
        </div>
      </div>
    `).join("");
    document.querySelectorAll("[data-toggle-block]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const userId = btn.getAttribute("data-toggle-block");
        const currentlyBlocked = btn.getAttribute("data-blocked")==="1";
        btn.disabled = true;
        try{
          await adminService.toggleBlockUser(userId, !currentlyBlocked);
          const u = allUsers.find(x=>x.id===userId);
          await adminService.logActivity(state.adminEmail, currentlyBlocked ? "Unblocked member" : "Blocked member", u ? u.name : userId);
          showToast(currentlyBlocked ? "✓ Unblock કર્યું" : "🚫 Block કર્યું");
          if(u) u.blocked = !currentlyBlocked;
          paint(allUsers);
        }catch(err){ showToast("Error: "+err.message); btn.disabled=false; }
      });
    });
  }

  adminService.getAllUsers().then(list=>{
    allUsers = list;
    paint(allUsers);
    document.getElementById("m-search").addEventListener("input", (e)=>{
      const q = e.target.value.trim().toLowerCase();
      if(!q){ paint(allUsers); return; }
      paint(allUsers.filter(u => (u.name||"").toLowerCase().includes(q) || (u.mobile||"").includes(q)));
    });
  }).catch(err=>{
    document.getElementById("members-list").innerHTML = `<div class="status-banner status-err" style="margin:16px;">Data load ના થયું: ${err.message}</div>`;
  });
}

function renderManageAdmins(main){
  main.innerHTML = `
    <div class="topbar"><div><h1>🛡️ Manage Admins</h1><div class="sub">Staff/Viewer admins add કરો — Super Admin only</div></div></div>
    <div class="panel" style="padding:18px;">
      <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:12px;">નવો Admin Add કરો</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;">
        <div><label style="display:block;font-size:11px;font-weight:600;color:var(--text-dark);margin-bottom:5px;">Name</label><div class="input-wrap"><input id="na-name" style="border:none;outline:none;padding:10px 0;font-size:13px;width:100%;font-family:inherit;"></div></div>
        <div><label style="display:block;font-size:11px;font-weight:600;color:var(--text-dark);margin-bottom:5px;">Email</label><div class="input-wrap"><input id="na-email" style="border:none;outline:none;padding:10px 0;font-size:13px;width:100%;font-family:inherit;"></div></div>
        <div><label style="display:block;font-size:11px;font-weight:600;color:var(--text-dark);margin-bottom:5px;">Password</label><div class="input-wrap"><input id="na-password" type="text" style="border:none;outline:none;padding:10px 0;font-size:13px;width:100%;font-family:inherit;"></div></div>
        <div><label style="display:block;font-size:11px;font-weight:600;color:var(--text-dark);margin-bottom:5px;">Role</label><div class="input-wrap"><select id="na-role" style="border:none;outline:none;padding:10px 0;font-size:13px;width:100%;font-family:inherit;background:transparent;">
          <option value="staff">Staff Admin</option>
          <option value="viewer">Viewer Admin</option>
        </select></div></div>
        <button class="btn btn-primary" id="na-submit" style="padding:11px 18px;">+ Add</button>
      </div>
      <div id="na-err"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Current Admins</h2></div>
      <div id="admins-list"><div style="padding:20px;color:var(--text-mid);font-size:13px;">Load થઈ રહ્યું છે...</div></div>
    </div>
  `;
  function loadList(){
    adminService.getAdmins().then(list=>{
      document.getElementById("admins-list").innerHTML = list.map(a=>`
        <div class="approval-row">
          <div class="ar-photo" style="background:linear-gradient(160deg,#7FC7E0,#1C93C9);">👤</div>
          <div class="ar-info"><div class="ar-name">${a.name}</div><div class="ar-meta">${a.email}</div></div>
          <span class="status-badge ${a.role==='super'?'badge-approved':'badge-rejected'}" style="${a.role!=='super'?'background:var(--ice);color:var(--primary);':''}">${a.role==='super'?'Super Admin':a.role==='staff'?'Staff Admin':'Viewer Admin'}</span>
        </div>
      `).join("");
    });
  }
  loadList();
  document.getElementById("na-submit").addEventListener("click", async (e)=>{
    const name=document.getElementById("na-name").value.trim();
    const email=document.getElementById("na-email").value.trim();
    const password=document.getElementById("na-password").value.trim();
    const role=document.getElementById("na-role").value;
    const errEl=document.getElementById("na-err"); errEl.innerHTML="";
    if(!name||!email||!password){ errEl.innerHTML = `<div class="err-text">Name, Email અને Password — ત્રણેય ભરો</div>`; return; }
    if(password.length<4){ errEl.innerHTML = `<div class="err-text">Password ઓછામાં ઓછો 4 characters નો હોવો જોઈએ</div>`; return; }
    e.target.disabled=true; e.target.textContent="Adding...";
    try{
      await adminService.addAdmin({name,email,password,role});
      await adminService.logActivity(state.adminEmail, "Added new admin", `${name} (${role})`);
      showToast("✓ Admin add થયો");
      document.getElementById("na-name").value=""; document.getElementById("na-email").value=""; document.getElementById("na-password").value="";
      e.target.disabled=false; e.target.textContent="+ Add";
      loadList();
    }catch(err){
      e.target.disabled=false; e.target.textContent="+ Add";
      errEl.innerHTML = `<div class="err-text">${err.message}</div>`;
    }
  });
}

function renderExport(main){
  main.innerHTML = `
    <div class="topbar"><div><h1>📤 Export Data</h1><div class="sub">CSV file માં data download કરો (Excel માં ખૂલી શકે)</div></div></div>
    <div class="panel" style="padding:18px;">
      <div class="quick-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
        <div class="quick-card" id="exp-members" style="cursor:pointer;"><div class="quick-icon">👥</div><div class="quick-label">All Members Export</div></div>
        <div class="quick-card" id="exp-candidates" style="cursor:pointer;"><div class="quick-icon">📋</div><div class="quick-label">All Candidates Export</div></div>
      </div>
    </div>
  `;
  function downloadCSV(filename, rows){
    const csv = rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }
  document.getElementById("exp-members").addEventListener("click", async ()=>{
    try{
      const users = await adminService.getAllUsers();
      const rows = [["Name","Mobile","Village","Blocked"], ...users.map(u=>[u.name,u.mobile,u.village||"",u.blocked?"Yes":"No"])];
      downloadCSV("members.csv", rows);
      await adminService.logActivity(state.adminEmail, "Exported data", "All Members");
      showToast("✓ Download શરૂ થયું");
    }catch(err){ showToast("Error: "+err.message); }
  });
  document.getElementById("exp-candidates").addEventListener("click", async ()=>{
    try{
      const candidates = await adminService.getPending();
      const rows = [["Name","Gender","Age","City","Education","Status"], ...candidates.map(c=>[c.name,c.gender||"",c.age||"",c.city||"",c.education||"",c.status])];
      downloadCSV("candidates.csv", rows);
      await adminService.logActivity(state.adminEmail, "Exported data", "All Candidates");
      showToast("✓ Download શરૂ થયું");
    }catch(err){ showToast("Error: "+err.message); }
  });
}

        <div class="ar-photo" style="background:linear-gradient(160deg,#7FC7E0,#1C93C9);font-size:14px;">📝</div>

}

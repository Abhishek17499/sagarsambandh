<!-- Form -->
<form onsubmit="event.preventDefault(); location.href='discover.html';" class="flex flex-col gap-5 w-full">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Email or Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded-DEFAULT border border-soft-sky bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant input-glow transition-all duration-200" id="email" placeholder="Enter your email or mobile" value="priya.sharma@example.com" required="" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">lock</span>
<input class="w-full pl-10 pr-10 py-3 rounded-DEFAULT border border-soft-sky bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant input-glow transition-all duration-200" id="password" placeholder="Enter your password" value="password123" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>

    Login
    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

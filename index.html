<div class="phone" id="phone"><div class="notch"></div><div id="app"></div></div>
<div id="recaptcha-container"></div>

<script>
// ============================================================
// FIREBASE SETUP
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDeGx5aNtf8aPRviA4rYfdM0Nc65F_35is",
  authDomain: "sagar-sambandh.firebaseapp.com",
  projectId: "sagar-sambandh",
  storageBucket: "sagar-sambandh.firebasestorage.app",
  messagingSenderId: "822553770547",
  appId: "1:822553770547:web:ffb69be461f4a38d5d8146",
};

let db = null;
let storage = null;
let auth = null;
let firebaseReady = false;
let firebaseError = null;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  storage = firebase.storage();
  auth = firebase.auth();
  firebaseReady = true;
} catch (e) {
  firebaseError = e.message;
}



// Anonymous sign-in: gives every visitor a silent Firebase Auth session.
// This lets Firestore/Storage Rules require request.auth != null, which blocks
// Waits for Firebase to restore any existing session first (a returning
// member's phone-verified login persists automatically). Only falls back to
// a silent Anonymous session if nobody is signed in — this way Firestore
// Rules can always require request.auth != null, even for pre-login browsing.
let authReadyPromise = firebaseReady
  ? new Promise((resolve) => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try { await auth.signInAnonymously(); }
          catch (e) { firebaseError = "Auth failed: " + e.message; }
        }
        resolve();
      });
    })
  : Promise.resolve();

// ⚠️ DEV/TESTING FALLBACK note (22 Aug 2026, superseded 17 Sep 2026): Real
// Phone OTP was temporarily throttled that day (App Check misconfiguration —
// see Sagar-Sambandh-OTP-Bug-Summary.docx) and the app ran on Mobile+PIN
// only for a few weeks. As of this version, OTP is back — but only at the
// two moments that actually need to prove phone ownership: (1) Signup, and
// (2) Forgot PIN. Daily login stays Mobile+PIN (no SMS cost). Mechanism:
// signInWithPhoneNumber() gives a REAL, phone-verified Firebase Auth session
// for that phone number's uid; right after that, an Email/Password
// credential (fake email + PIN-derived password, same trick as before) gets
// *linked* to that SAME uid via linkWithCredential(), so later Mobile+PIN
// logins sign into the identical, already-phone-verified account — no
// second OTP needed until the person forgets their PIN.
function mobileToEmail(mobile){ return `${mobile}@sagarsambandh.local`; }
function pinToPassword(pin){ return `sagar${pin}bandh`; } // Firebase needs 6+ chars; PIN itself stays 4 digits in the UI

let pendingConfirmationResult = null;
function getRecaptchaVerifier(){
  if (!window._recaptchaVerifier) {
    window._recaptchaVerifier = new firebase.auth.RecaptchaVerifier("recaptcha-container", {
      size: "invisible"
    });
  }
  return window._recaptchaVerifier;
}
function resetRecaptchaVerifier(){
  try {
    if (window._recaptchaVerifier) {
      window._recaptchaVerifier.clear();
      window._recaptchaVerifier = null;
    }
  } catch(e) {}
}

// ============================================================
// DATA SERVICE — real Firestore calls
// Collections used:
//   users      { name, mobile, village, createdAt } — doc ID = Firebase Auth uid
//   candidates { name, gender, age, education, city, occupation, rashi,
//                maritalStatus, fatherName, motherName, height,
//                siblings, status: "approved"|"pending", photoEmoji, photoColor, createdAt }
//   interests  { fromUserId, toCandidateId, status: "pending", createdAt }
// ============================================================
// Multiple Photos migration helper — જૂના candidates ને ફક્ત `photoURL` (single-photo
// જમાનાનું) હોય, નવા ને `photos` array — બંને કિસ્સામાં cover photo ની URL આપે.
function primaryPhotoURL(c){
  if (c.photos && c.photos.length > 0) return c.photos[0].url;
  return c.photoURL || null;
}

// Avatar color/emoji — gender ના આધારે હંમેશા fresh compute થાય છે, Firestore માં
// stored જૂની value (photoColor/photoEmoji) ક્યારેય નથી વપરાતી. આનાથી future માં
// theme બદલાય તો પણ જૂના candidates ના avatar આપોઆપ નવા રંગમાં દેખાય — કોઈ data
// migration જરૂરી નહીં.
function avatarStyle(c){
  const isFemale = c.gender === "female";
  return {
    color: isFemale ? "linear-gradient(160deg,#D98FA0,#A8455C)" : "linear-gradient(160deg,#A8455C,#4A1220)",
    emoji: isFemale ? "👩" : "👨",
  };
}

// Font Size preference — device-local (localStorage), 3 levels. Rather than
// rewriting every individual font-size value across the app, the whole
// `.phone` wrapper is zoomed as one unit — text, spacing and icons scale
// together proportionally, same idea as browser zoom.
const FONT_ZOOM_LEVELS = { small: 0.9, medium: 1, large: 1.15 };
function getFontSizePref(){
  return localStorage.getItem("sagarSambandhFontSize") || "medium";
}
function applyFontZoom(){
  const phoneEl = document.getElementById("phone");
  if(phoneEl) phoneEl.style.zoom = FONT_ZOOM_LEVELS[getFontSizePref()] || 1;
}

const dataService = {
  // Step 1 of Signup / Forgot-PIN — sends the real SMS OTP via Firebase Phone
  // Auth. Same call powers both flows; what happens after confirmOtp()
  // differs (collect name+PIN for a new account, vs. just set a new PIN).
  async sendOtp(mobile) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    try {
      const verifier = getRecaptchaVerifier();
      const fullPhone = "+91" + mobile;
      pendingConfirmationResult = await auth.signInWithPhoneNumber(fullPhone, verifier);
      return { success: true };
    } catch(err) {
      resetRecaptchaVerifier();
      throw err;
    }
  },

  // Step 2 — verifies the 6-digit code. On success the person now has a
  // REAL, phone-verified Firebase Auth session (auth.currentUser). Returns
  // whether a users/{uid} doc already exists for this phone, so the caller
  // can route to "collect name+PIN" (new) or "set a new PIN" (existing).
  async confirmOtp(code) {
    if (!pendingConfirmationResult) throw new Error("પહેલા OTP મોકલો");
    const result = await pendingConfirmationResult.confirm(code);
    pendingConfirmationResult = null;
    const phoneUid = result.user.uid;
    const cleanPhone = (state.pendingMobile || "").replace(/\D/g, "").slice(-10);

    // 1. Check if user doc exists by phone UID
    let userDoc = await db.collection("users").doc(phoneUid).get();
    let existingData = null;
    let finalUid = phoneUid;

    if (userDoc.exists) {
      existingData = userDoc.data();
    } else if (cleanPhone) {
      // 2. Also check by mobile number (in case account was created via Email/Password previously)
      const snap = await db.collection("users").where("mobile", "==", cleanPhone).limit(1).get();
      if (!snap.empty) {
        userDoc = snap.docs[0];
        existingData = userDoc.data();
        finalUid = userDoc.id;
      }
    }

    if (existingData) {
      if (existingData.blocked) {
        await auth.signOut();
        throw new Error("તમારું account block કરવામાં આવ્યું છે. Admin નો સંપર્ક કરો.");
      }
      return { isNewUser: false, id: finalUid, name: existingData.name, mobile: existingData.mobile || cleanPhone, village: existingData.village };
    }
    return { isNewUser: true, id: phoneUid, mobile: cleanPhone || result.user.phoneNumber };
  },

  // Signup step 3 — after OTP verified for a brand-new number: link an
  // Email/Password credential (fake email + PIN-derived password) to the
  // already-phone-verified uid, then create the users/{uid} Firestore doc.
  async completeSignup(uid, mobile, pin, name, village) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const emailCred = firebase.auth.EmailAuthProvider.credential(mobileToEmail(mobile), pinToPassword(pin));
    try {
      await auth.currentUser.linkWithCredential(emailCred);
    } catch (e) {
      if (e.code !== "auth/provider-already-linked" && e.code !== "auth/email-already-in-use" && e.code !== "auth/credential-already-in-use") {
        throw new Error(e.message || "Account setup ના થયું");
      }
    }
    await db.collection("users").doc(uid).set({
      name, village, mobile, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
    return { id: uid, name, mobile, village };
  },

  // Forgot-PIN — after OTP re-verified for an EXISTING number: overwrite the
  // linked Email/Password credential's password with the new PIN.
  async resetPin(mobile, newPin) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const newPass = pinToPassword(newPin);
    try {
      await auth.currentUser.updatePassword(newPass);
    } catch (e) {
      const emailCred = firebase.auth.EmailAuthProvider.credential(mobileToEmail(mobile), newPass);
      try {
        await auth.currentUser.linkWithCredential(emailCred);
      } catch (err) {
        if (err.code !== "auth/provider-already-linked" && err.code !== "auth/email-already-in-use") {
          throw new Error(err.message || "PIN અપડેટ ના થયો");
        }
      }
    }
    return { success: true };
  },

  async login(mobile, pin) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    let cred;
    try {
      cred = await auth.signInWithEmailAndPassword(mobileToEmail(mobile), pinToPassword(pin));
    } catch (e) {
      if (e.code === "auth/user-not-found") throw new Error("આ Mobile Number થી કોઈ account નથી — 'નવું Account બનાવો' પસંદ કરો");
      if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") throw new Error("PIN ખોટો છે");
      throw new Error(e.message || "Login ના થયું");
    }
    const doc = await db.collection("users").doc(cred.user.uid).get();
    if (!doc.exists) throw new Error("Account ડેટા ના મળ્યો — Admin નો સંપર્ક કરો");
    const data = doc.data();

  // One-time lookup of the user's own candidate(s) by gender — used to
  // compute Match Score for every profile on every page, without refetching
  // per page. Called once when Home mounts.
  async getMyRefByGender(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    let myRefByGender = { male: null, female: null };
    if (userId) {
      const mySnap = await db.collection("candidates").where("createdByUserId", "==", userId).get();
      mySnap.docs.map(d => d.data()).forEach(c => {
        if ((c.gender === "male" || c.gender === "female") && !myRefByGender[c.gender]) myRefByGender[c.gender] = c;
      });
    }
    return myRefByGender;
  },

  _computeMatchScore(p, myRefByGender) {
    const COMPATIBLE_RASHI = {
      "મેષ":["સિંહ","ધન"], "વૃષભ":["કન્યા","મકર"], "મિથુન":["તુલા","કુંભ"], "કર્ક":["વૃશ્ચિક","મીન"],
      "સિંહ":["મેષ","ધન"], "કન્યા":["વૃષભ","મકર"], "તુલા":["મિથુન","કુંભ"], "વૃશ્ચિક":["કર્ક","મીન"],
      "ધન":["મેષ","સિંહ"], "મકર":["વૃષભ","કન્યા"], "કુંભ":["મિથુન","તુલા"], "મીન":["કર્ક","વૃશ્ચિક"],
    };
    const myRef = p.gender === "male" ? myRefByGender.female : p.gender === "female" ? myRefByGender.male : null;
    if (!myRef) return null;
    let score = 0;
    if (myRef.city && p.city && myRef.city === p.city) score += 1;
    const ageDiff = Math.abs((myRef.age||0) - (p.age||0));
    if (ageDiff <= 5) score += 2; else if (ageDiff <= 8) score += 1;
    if (myRef.rashi && p.rashi) {
      if (myRef.rashi === p.rashi) score += 1;
      else if ((COMPATIBLE_RASHI[myRef.rashi]||[]).includes(p.rashi)) score += 1.5;
    }
    if (myRef.education && p.education && myRef.education === p.education) score += 1;
    return Math.min(5, Math.round(score * 2) / 2);
  },

  _annotate(profiles, myRefByGender, favSet) {
    return profiles.map(p => ({ ...p, matchScore: this._computeMatchScore(p, myRefByGender), favorite: favSet.has(p.id) }));
  },

  // Paginated fetch — one page (default 20) of approved candidates, newest
  // first. `gender` (optional) is applied as a real Firestore query filter
  // (server-side) since it's the one filter cheap enough to index for every
  // combination; Age/Rashi/Area stay client-side over whatever's been
  // loaded (see ensureEnoughForFilters in renderHome). Pass the previous
  // page's `lastDoc` as the cursor for the next page (null for page 1).
  // NOTE: `hasMore` is a heuristic (true when a full page came back) — since
  // deactivated/own-candidate docs are filtered out client-side after the
  // fact, a page can occasionally come back shorter than pageSize even
  // though more records exist; the next scroll simply fetches again.
  async getProfilesPage(userId, { gender, lastDoc, pageSize, myRefByGender, favSet } = {}) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const size = pageSize || 20;
    let query = db.collection("candidates").where("status", "==", "approved");
    if (gender) query = query.where("gender", "==", gender);
    query = query.orderBy("createdAt", "desc").limit(size);
    if (lastDoc) query = query.startAfter(lastDoc);
    const snap = await query.get();
    const rawDocs = snap.docs;
    let profiles = rawDocs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.deactivated && p.createdByUserId !== userId);
    profiles = this._annotate(profiles, myRefByGender || {male:null,female:null}, favSet || new Set());
    return {
      profiles,
      lastDoc: rawDocs.length ? rawDocs[rawDocs.length - 1] : null,
      hasMore: rawDocs.length === size,
    };
  },

  // Full-fetch — used only for the explicit "બધામાં શોધો" (search all)
  // button, so its cost (a full collection read, minus the gender filter if
  // active) is opt-in rather than automatic on every keystroke.
  async searchAllProfiles(userId, { gender, myRefByGender, favSet } = {}) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    let query = db.collection("candidates").where("status", "==", "approved");
    if (gender) query = query.where("gender", "==", gender);
    const snap = await query.get();
    let profiles = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.deactivated && p.createdByUserId !== userId);
    return this._annotate(profiles, myRefByGender || {male:null,female:null}, favSet || new Set());
  },

  async sendInterest(userId, candidateId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    // Duplicate-interest guard — a person could otherwise tap "Send Interest"
    // repeatedly (or reopen the same profile) and create several pending
    // interests toward the same candidate, cluttering both their own Sent
    // list and the receiving family's Received list.
    const existing = await db.collection("interests")
      .where("fromUserId", "==", userId)
      .where("toCandidateId", "==", candidateId)
      .where("status", "==", "pending")
      .limit(1).get();
    if (!existing.empty) throw new Error("તમે આ પ્રોફાઇલ ને પહેલેથી ઈન્ટરેસ્ટ મોકલેલું છે");
    await db.collection("interests").add({
      fromUserId: userId, toCandidateId: candidateId, status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { success: true };
  },

  async getPendingInterestCount(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const myCandidates = await db.collection("candidates").where("createdByUserId", "==", userId).get();
    const ids = myCandidates.docs.map(d => d.id);
    if (ids.length === 0) return 0;
    let count = 0;
    for (const cid of ids) {
      const snap = await db.collection("interests").where("toCandidateId", "==", cid).where("status", "==", "pending").get();
      count += snap.size;
    }
    return count;
  },

  // SENT interests — જે તમે (fromUserId) બીજા candidates ને મોકલ્યા છે.
  async getSentInterests(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("interests").where("fromUserId", "==", userId).get();
    const results = [];
    for (const d of snap.docs) {
      const data = d.data();
      let toCandidateName = "-", toCandidateCity = "", toCandidateAge = "";
      try {
        const candDoc = await db.collection("candidates").doc(data.toCandidateId).get();
        if (candDoc.exists) {
          const cd = candDoc.data();
          toCandidateName = cd.name; toCandidateCity = cd.city||""; toCandidateAge = cd.age||"";
        }
      } catch(e){}
      results.push({ id: d.id, ...data, toCandidateName, toCandidateCity, toCandidateAge });
    }
    return results.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  // Pending sent interest પાછું ખેંચવું — doc delete કરે છે (Rules: fromUserId ના
  // owner જ પોતાનો pending interest delete કરી શકે).
  async cancelInterest(interestId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("interests").doc(interestId).delete();

  async getReceivedInterests(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const myCandidates = await db.collection("candidates").where("createdByUserId", "==", userId).get();
    const myCandidateIds = myCandidates.docs.map(d => d.id);
    const candidateNameById = {};
    myCandidates.docs.forEach(d => { candidateNameById[d.id] = d.data().name; });
    if (myCandidateIds.length === 0) return [];
    const results = [];
    for (const cid of myCandidateIds) {
      const snap = await db.collection("interests").where("toCandidateId", "==", cid).get();
      for (const d of snap.docs) {
        const data = d.data();
        let fromUserName = "સભ્ય";
        try {
          const fromUserDoc = await db.collection("users").doc(data.fromUserId).get();
          if (fromUserDoc.exists) fromUserName = fromUserDoc.data().name;
        } catch(e){}
        results.push({ id: d.id, ...data, forCandidateName: candidateNameById[cid], fromUserName });
      }
    }
    return results.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  // Multiple Photos (max 5) — જૂના candidates ને ફક્ત `photoURL` (single-photo) હોય તો
  // પહેલી વાર નવો photo ઉમેરે ત્યારે એ જૂનો photo પણ gallery માં migrate થઈ જાય, ખોવાય નહીં.
  async uploadCandidatePhoto(candidateId, file) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const docRef = db.collection("candidates").doc(candidateId);
    const snap = await docRef.get();
    const data = snap.data() || {};
    let photos = Array.isArray(data.photos) ? data.photos.slice() : [];
    if (photos.length === 0 && data.photoURL) {
      photos.push({ url: data.photoURL, path: `candidates/${candidateId}/photo.jpg` });
    }
    if (photos.length >= 5) throw new Error("મહત્તમ 5 photos જ upload કરી શકાય");
    const filename = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
    const path = `candidates/${candidateId}/photos/${filename}`;
    const ref = storage.ref().child(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    photos.push({ url, path });
    await docRef.update({
      photos,
      photoURL: firebase.firestore.FieldValue.delete(),
      status: "pending", // નવો photo ઉમેરાય એટલે re-approval જરૂરી, docs/edit જેમ
    });
    return { photos };
  },

  async removeCandidatePhoto(candidateId, photo) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    try { await storage.ref().child(photo.path).delete(); }
    catch (e) { /* Storage માંથી પહેલેથી delete થયેલી હોય તો પણ Firestore reference clean કરો */ }
    await db.collection("candidates").doc(candidateId).update({
      photos: firebase.firestore.FieldValue.arrayRemove(photo),
      status: "pending",
    });
    return { success: true };
  },

  async uploadDocument(candidateId, docKey, file) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const ref = storage.ref().child(`candidates/${candidateId}/docs/${docKey}`);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection("candidates").doc(candidateId).update({
      [`docs.${docKey}`]: { url, uploadedAt: new Date().toISOString(), name: file.name },
      status: "pending",
    });
    return url;
  },

  async removeDocument(candidateId, docKey) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    try { await storage.ref().child(`candidates/${candidateId}/docs/${docKey}`).delete(); }
    catch (e) { /* Storage માંથી પહેલેથી delete થયેલી હોય તો પણ Firestore reference clean કરો */ }
    await db.collection("candidates").doc(candidateId).update({
      [`docs.${docKey}`]: firebase.firestore.FieldValue.delete(),
    });
    return { success: true };
  },

  async createCandidate(userId, payload) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const existing = await db.collection("candidates").where("createdByUserId", "==", userId).get();
    const activeCount = existing.docs.filter(d => !d.data().deactivated).length;
    if (activeCount >= 4) throw new Error("એક account થી વધુમાં વધુ 4 active profiles બની શકે છે");
    const photoStyles = [
      { color:"linear-gradient(160deg,#D98FA0,#A8455C)", emoji: payload.gender==="female" ? "👩" : "👨" },
    ];
    const ref = await db.collection("candidates").add({
      ...payload,
      createdByUserId: userId,
      status: "pending",
      photoVisible: false, // નવા profiles માટે Default: Hidden — candidate પોતે My Profiles માંથી Show કરી શકે
      siblingsVisible: false, // ભાઈ-બહેન ની વિગત પણ Default: Hidden — candidate પોતે My Profiles માંથી Show કરી શકે
      photoColor: photoStyles[0].color,
      photoEmoji: photoStyles[0].emoji,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { id: ref.id };
  },

  // Photo visibility toggle — candidate પોતાના photo ને બીજા members થી Show/Hide કરી શકે.
  // આ ફક્ત display-preference છે (candidate ની actual data નહીં), એટલે status ને "pending" નથી કરતું —

// XSS-safety helper — every piece of user-supplied text (candidate name, city,
// occupation, admin action targetName, etc.) that gets inserted into an
// innerHTML template MUST go through this first. Without it, a candidate
// could submit a name like `<img src=x onerror=alert(1)>` and have it
// execute as real HTML/script for anyone who later views that card (stored
// XSS) — including an Admin reviewing the profile.
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function showToast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

// Inline field-error helpers — highlights the actual invalid field's .input-wrap
// (or .otp-boxes container) with a red border, on top of the existing error
// text below the form. Auto-clears the highlight the moment the person edits
// that field, so the red border doesn't linger after they've fixed it.
function setFieldError(inputId, hasError){
  const input = document.getElementById(inputId);
  if(!input) return;
  let wrap = input.closest(".input-wrap") || input.closest(".otp-boxes");
  if(!wrap && input.tagName === "SELECT"){
    // select2 injects a sibling .select2-container right after the original <select>
    const s2 = input.nextElementSibling;
    wrap = (s2 && s2.classList.contains("select2-container")) ? s2.querySelector(".select2-selection--single") : input;
  }
  wrap = wrap || input;
  if(hasError){
    wrap.classList.add("field-error");
    const clear = ()=>{ wrap.classList.remove("field-error"); input.removeEventListener("input", clear); input.removeEventListener("change", clear); };
    input.addEventListener("input", clear);
    input.addEventListener("change", clear);
  } else {
    wrap.classList.remove("field-error");
  }
}
function markFieldErrors(ids){ ids.forEach(id=>setFieldError(id, true)); }
function clearFieldErrors(ids){ ids.forEach(id=>setFieldError(id, false)); }

// Loading skeleton — card-shaped shimmer placeholders instead of a bare
// "Load થઈ રહ્યું છે..." text line, for list screens (Home/MyProfiles/Interest).

// Upload validation — the browser's `accept` attribute on a file input is
// only a hint (a person can bypass it and pick any file from "All Files"),
// so it's not real protection. This is the actual check, run before every
// upload, against oversized or wrong-type files reaching Storage.
function validateUploadFile(file, { maxMB, allowedTypes, label }){
  if (!allowedTypes.some(t => file.type === t || (t.endsWith("/*") && file.type.startsWith(t.slice(0,-1))))) {
    return `${label} ફક્ત ${allowedTypes.join(", ")} format માં જ upload કરી શકાય`;
  }
  if (file.size > maxMB * 1024 * 1024) {
    return `${label} ${maxMB}MB થી નાનો હોવો જોઈએ`;
  }
  return null;
}

function renderChecking(){
  app.innerHTML = `<div class="content"><div class="loading">Firebase connection check થઈ રહ્યું છે...</div></div>`;
  setTimeout(async ()=>{
    if(!firebaseReady){
      app.innerHTML = `
        <div class="header"><div class="header-title">⚠ Connection Issue</div></div>
        <div class="content">
          <div class="status-banner status-err">Firebase load ના થયું</div>
          <p style="font-size:12.5px;color:var(--text-mid);line-height:1.7;">
            આ preview sandbox માં external Firebase scripts block થઈ શકે છે. Real testing માટે આ file ને Firebase Hosting (અથવા કોઈ પણ live web server) પર deploy કરવી પડશે — ત્યાં આ સમસ્યા નહીં આવે.
          </p>
          <p style="font-size:11px;color:var(--danger);margin-top:10px;">Error: ${firebaseError||"unknown"}</p>
        </div>`;
      return;
    }
    await authReadyPromise;
    if(firebaseError && !firebaseError.startsWith("Auth failed:")){
      app.innerHTML = `
        <div class="header"><div class="header-title">⚠ Connection Issue</div></div>
        <div class="content">
          <div class="status-banner status-err">Authentication setup ના થયું</div>
          <p style="font-size:12.5px;color:var(--text-mid);line-height:1.7;">
            Firebase Console માં "Authentication → Sign-in method → Anonymous" enable કરેલું છે કે નહીં ચકાસો.
          </p>
          <p style="font-size:11px;color:var(--danger);margin-top:10px;">Error: ${firebaseError}</p>
        </div>`;
      return;
    }
    // Session restore: relies on Firebase Auth's own persisted session
    const currentUser = auth.currentUser;
    if(currentUser && !currentUser.isAnonymous){
      try{
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        if(userDoc.exists){
          const data = userDoc.data();
          if(!data.blocked){
            state.user = { id: currentUser.uid, name: data.name, mobile: data.mobile, village: data.village };
            localStorage.setItem("sagar_last_mobile", data.mobile);
            localStorage.setItem("sagar_last_name", data.name || "");
            localStorage.setItem("sagar_device_registered_" + data.mobile, "true");
            state.screen="home"; render(); return;
          }
        }
      }catch(e){ /* fall through to device check if lookup fails */ }
    }

    // Angel One Style: If this device was already verified, prompt directly for 4-digit PIN!
    const lastMobile = localStorage.getItem("sagar_last_mobile");
    if(lastMobile && localStorage.getItem("sagar_device_registered_" + lastMobile) === "true"){
      state.pendingMobile = lastMobile;
      state.screen = "loginPin";
      render();
      return;
    }

    // First time on device -> ask for mobile number
    state.screen="mobileEntry"; render();
  }, 400);
}

  let allProfiles = [];       // accumulated across loaded pages
  let lastDoc = null;         // Firestore cursor for the next page
  let hasMore = true;
  let isLoadingMore = false;
  let serverGender = "";      // gender filter currently reflected in the query (server-side)
  let myRefByGender = { male: null, female: null };
  let favSet = new Set();

  let activeGender = "";
  let sortByMatch = false;
  let favOnly = false;
  let ageMin = null, ageMax = null;
  let selectedRashis = new Set();
  let selectedAreas = new Set();
  let searchAllResults = null; // set when "બધામાં શોધો" has been used for the current query

  function annotate(list){
    return list.map(p => ({ ...p, favorite: favSet.has(p.id) }));

        </div>
      </div>
    `;
    }).join("") + (isCurrentlySearching() ? searchAllBtnHtml() : "") + (hasMore && !isCurrentlySearching() ? `<div class="loading" id="infinite-loading" style="padding:16px;">વધુ load થઈ રહ્યા છે...</div>` : "");
    document.querySelectorAll("[data-open]").forEach(card=>{
      card.addEventListener("click", ()=>{ state.openProfileId = card.getAttribute("data-open"); state.screen="detail"; render(); });
    });
    document.querySelectorAll("[data-fav-toggle]").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        if(!state.user){ return; }
        const id = btn.getAttribute("data-fav-toggle");
        const p = allProfiles.find(x=>x.id===id) || (searchAllResults||[]).find(x=>x.id===id);
        if(!p) return;
        const newVal = !p.favorite;
        const visual = btn.querySelector(".fav-btn-visual");
        p.favorite = newVal; // optimistic UI — તરત જ heart બદલાય
        if(newVal) favSet.add(id); else favSet.delete(id);
        visual.textContent = newVal ? '❤️' : '🤍';
        try{ await dataService.toggleFavorite(state.user.id, id, newVal); }
        catch(err){ p.favorite = !newVal; if(!newVal) favSet.add(id); else favSet.delete(id); visual.textContent = !newVal ? '❤️' : '🤍'; showToast("Error: "+err.message); }
        updateFavCount();
        if(favOnly) applyFilters();
      });
    });
    if(isCurrentlySearching()) attachSearchAllBtn();
  }

  function isCurrentlySearching(){
    return document.getElementById("home-search") && document.getElementById("home-search").value.trim().length > 0;
  }

  // "બધામાં શોધો" — search box only checks records already loaded via
  // infinite-scroll by default (fast, no extra reads). This button does a
  // one-time full fetch (matching the active gender filter, if any) so a
  // search can reach candidates that haven't scrolled into view yet.
  function searchAllBtnHtml(){
    if(searchAllResults !== null) return ""; // already used for this query
    const q = document.getElementById("home-search") ? document.getElementById("home-search").value.trim() : "";
    if(!q) return "";
    return `<div id="search-all-btn" style="text-align:center;padding:14px;color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer;">🔍 બધા profiles માં "${escapeHtml(q)}" શોધો</div>`;
  }
  function attachSearchAllBtn(){
    const btn = document.getElementById("search-all-btn");
    if(!btn) return;
    btn.addEventListener("click", async ()=>{
      btn.textContent = "શોધી રહ્યા છીએ...";
      try{
        const full = await dataService.searchAllProfiles(state.user?.id, { gender: serverGender||null, myRefByGender, favSet });
        searchAllResults = full;
        applyFilters();
      }catch(err){ showToast("Error: "+err.message); }
    });
  }

  function updateFavCount(){
    const n = allProfiles.filter(p=>p.favorite).length;
    const badge = document.getElementById("hdr-fav-count");
    if(n>0){ badge.style.display="flex"; badge.textContent=n; } else { badge.style.display="none"; }
  }

  function updateFiltersCount(){
    let n = 0;
    if(activeGender) n++;
    if(ageMin || ageMax) n++;
    if(selectedRashis.size>0) n++;
    if(selectedAreas.size>0) n++;
    if(sortByMatch) n++;
    const badge = document.getElementById("hdr-filters-count");
    if(n>0){ badge.style.display="flex"; badge.textContent=n; } else { badge.style.display="none"; }
  }

  // Auto-load a few more pages if client-side filters (Age/Rashi/Area)
  // leave very few results but more pages are known to exist — otherwise a
  // filter could look "empty" just because the match hasn't scrolled into
  // view yet. Capped so one filter tap can't trigger unbounded reads.
  async function ensureEnoughForFilters(){
    const AUTO_LOAD_CAP = 5;
    let loads = 0;
    while(hasMore && loads < AUTO_LOAD_CAP){
      const filteredCount = clientFilter(allProfiles).length;
      if(filteredCount >= 8) break; // enough to show a reasonable page
      const gotMore = await loadNextPage();
      if(!gotMore) break;
      loads++;
    }
  }

  function clientFilter(source){
    const q = document.getElementById("home-search") ? document.getElementById("home-search").value.trim().toLowerCase() : "";
    let list = source;
    if(favOnly) list = list.filter(p => p.favorite);
    if(ageMin) list = list.filter(p => (p.age||0) >= ageMin);
    if(ageMax) list = list.filter(p => (p.age||0) <= ageMax);
    if(selectedRashis.size>0) list = list.filter(p => selectedRashis.has(p.rashi));
    if(selectedAreas.size>0) list = list.filter(p => selectedAreas.has((p.city||"").trim()));
    if(q){
      list = list.filter(p =>
        (p.name||"").toLowerCase().includes(q) ||
        (p.city||"").toLowerCase().includes(q) ||
        (p.occupation||"").toLowerCase().includes(q) ||
        (p.education||"").toLowerCase().includes(q)
      );
    }
    return list;
  }

  async function applyFilters(){
    const source = searchAllResults !== null ? searchAllResults : allProfiles;
    if(searchAllResults === null) await ensureEnoughForFilters();
    let list = clientFilter(searchAllResults !== null ? searchAllResults : allProfiles);
    if(sortByMatch) list = [...list].sort((a,b) => (b.matchScore||0) - (a.matchScore||0));
    paintList(list);
    updateFiltersCount();
  }

  // Fetches the next page (server-side gender filter applied if active),
  // annotates with match-score/favorite, appends to allProfiles. Returns
  // true if any new records were added.
  async function loadNextPage(){
    if(isLoadingMore || !hasMore) return false;
    isLoadingMore = true;
    try{
      const page = await dataService.getProfilesPage(state.user?.id, {
        gender: serverGender || null, lastDoc, pageSize: 20, myRefByGender, favSet,
      });
      allProfiles = allProfiles.concat(page.profiles);
      lastDoc = page.lastDoc;
      hasMore = page.hasMore;
      return page.profiles.length > 0;
    }catch(err){
      showToast("Error: "+err.message);
      return false;
    }finally{
      isLoadingMore = false;
    }
  }

  // Infinite scroll — window-level listener, replaced on every renderHome()
  // call so repeated Home visits don't stack up duplicate listeners.
  if(window._homeScrollHandler) window.removeEventListener("scroll", window._homeScrollHandler);
  window._homeScrollHandler = async ()=>{
    if(state.screen !== "home") return;
    if(isCurrentlySearching()) return; // search mode doesn't auto-page
    const nearBottom = (document.documentElement.scrollHeight - window.innerHeight - window.scrollY) < 400;
    if(nearBottom && hasMore && !isLoadingMore){
      const got = await loadNextPage();
      if(got) applyFilters();
    }
  };
  window.addEventListener("scroll", window._homeScrollHandler);

  document.getElementById("hdr-fav-btn").addEventListener("click", ()=>{
    favOnly = !favOnly;
    showToast(favOnly ? "❤️ ફક્ત Favorites દેખાડું છું" : "બધા profiles પાછા દેખાડું છું");
    applyFilters();
  });

  const overlay = document.getElementById("filters-overlay");
  document.getElementById("hdr-filters-btn").addEventListener("click", ()=>{ overlay.style.display="block"; });
  document.getElementById("filters-close").addEventListener("click", ()=>{ overlay.style.display="none"; });
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.style.display="none"; });

  document.querySelectorAll(".fp-gender").forEach(seg=>{
    seg.addEventListener("click", ()=>{
      document.querySelectorAll(".fp-gender").forEach(s=>{ s.style.background="transparent"; s.style.color="var(--primary)"; });
      seg.style.background="var(--navy)"; seg.style.color="#fff";
      activeGender = seg.getAttribute("data-gender");
    });
  });
  document.querySelectorAll(".fp-rashi-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const r = chip.getAttribute("data-rashi");
      if(selectedRashis.has(r)){ selectedRashis.delete(r); chip.style.background="var(--ice)"; chip.style.color="var(--primary)"; }
      else{ selectedRashis.add(r); chip.style.background="var(--navy)"; chip.style.color="#fff"; }
    });
  });
  document.querySelectorAll(".fp-area-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const a = chip.getAttribute("data-area");
      if(selectedAreas.has(a)){ selectedAreas.delete(a); chip.style.background="var(--ice)"; chip.style.color="var(--primary)"; }
      else{ selectedAreas.add(a); chip.style.background="var(--accent)"; chip.style.color="var(--navy)"; }
    });
  });
  document.getElementById("filters-reset").addEventListener("click", ()=>{
    activeGender=""; ageMin=null; ageMax=null; selectedRashis.clear(); selectedAreas.clear(); sortByMatch=false;
    document.querySelectorAll(".fp-gender").forEach(s=>{ s.style.background="transparent"; s.style.color="var(--primary)"; });
    document.querySelector('.fp-gender[data-gender=""]').style.background="var(--navy)";
    document.querySelector('.fp-gender[data-gender=""]').style.color="#fff";
    document.getElementById("fp-age-min").value=""; document.getElementById("fp-age-max").value="";
    document.querySelectorAll(".fp-rashi-chip").forEach(c=>{ c.style.background="var(--ice)"; c.style.color="var(--primary)"; });
    document.querySelectorAll(".fp-area-chip").forEach(c=>{ c.style.background="var(--ice)"; c.style.color="var(--primary)"; });
    document.getElementById("fp-sort-match").checked=false;
  });
  document.getElementById("filters-apply").addEventListener("click", async ()=>{
    ageMin = Number(document.getElementById("fp-age-min").value) || null;
    ageMax = Number(document.getElementById("fp-age-max").value) || null;
    sortByMatch = document.getElementById("fp-sort-match").checked;
    overlay.style.display="none";
    if(activeGender !== serverGender){
      // Gender is a server-side query field — changing it means the current
      // page-cursor is no longer valid, so start over from page 1 with the
      // new gender filter instead of trying to patch the loaded set.
      serverGender = activeGender;
      allProfiles = []; lastDoc = null; hasMore = true; searchAllResults = null;
      document.getElementById("home-content").innerHTML = skeletonCards(4);
      await loadNextPage();
    }
    applyFilters();
  });

  document.getElementById("home-search").addEventListener("input", ()=>{ searchAllResults = null; applyFilters(); });

  (async ()=>{
    try{
      myRefByGender = await dataService.getMyRefByGender(state.user?.id);
      favSet = new Set(state.user?.id ? await dataService.getFavoriteIds(state.user.id) : []);
      await loadNextPage();
      updateFavCount();
      applyFilters();
    }catch(err){
      const el = document.getElementById("home-content");
      if(el) el.innerHTML = `<div class="status-banner status-err">Data load ના થયું: ${err.message}</div>`;
    }
  })();
}

function renderInterest(){

        <div class="int-tab" data-tab="sent" style="flex:1;text-align:center;padding:10px 0;font-size:12px;font-weight:700;border-radius:11px;cursor:pointer;color:rgba(255,255,255,0.85);">${t('sentTab')} <span class="int-tab-badge" id="tab-badge-sent" style="display:none;"></span></div>

      else if(k==="interest") render();

    });

    el.innerHTML = receivedList.map(i=>`
      <div class="card" style="cursor:default;">
        <div class="card-photo" style="background:linear-gradient(160deg,#D98FA0,#A8455C);">👤</div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(i.fromUserName)}</div>
          <div class="card-sub">${t('interestForProfile').replace('{name}', escapeHtml(i.forCandidateName))}</div>
          <span class="status-pending" style="background:${i.status==='accepted'?'#E7F6EF':i.status==='declined'?'#FCEBEA':'#FDF1E7'};color:${i.status==='accepted'?'var(--success)':i.status==='declined'?'var(--danger)':'#B4762A'};">
            ${i.status==='accepted'?t('statusAccepted'):i.status==='declined'?t('statusDeclined'):t('statusPendingShort')}
          </span>
          ${i.status==='pending' ? `
            <div style="display:flex;gap:6px;margin-top:8px;">
              <button class="mini-btn mini-accept" data-accept="${i.id}">${t('acceptBtn')}</button>
              <button class="mini-btn mini-decline" data-decline="${i.id}">${t('declineBtn')}</button>
            </div>
          ` : ""}
        </div>
      </div>
    `).join("");
    document.querySelectorAll("[data-accept]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        try{ await dataService.respondToInterest(btn.getAttribute("data-accept"), "accepted"); showToast(t('acceptedToast')); loadReceived(); }
        catch(err){ showToast("Error: "+err.message); }
      });
    });
    document.querySelectorAll("[data-decline]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        try{ await dataService.respondToInterest(btn.getAttribute("data-decline"), "declined"); showToast(t('declinedToast')); loadReceived(); }
        catch(err){ showToast("Error: "+err.message); }
      });
    });
  }

  function paintSent(){
    const el = document.getElementById("int-content");
    if(sentList.length===0){ el.innerHTML = `<div class="empty">${t('noSentMsg')}</div>`; return; }
    el.innerHTML = sentList.map(i=>`
      <div class="card" style="cursor:default;">
        <div class="card-photo" style="background:linear-gradient(160deg,#A8455C,#4A1220);">👤</div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(i.toCandidateName)}</div>
          <div class="card-sub">${i.toCandidateCity||'-'} · ${i.toCandidateAge||'-'} વર્ષ</div>
          <span class="status-pending" style="background:${i.status==='accepted'?'#E7F6EF':i.status==='declined'?'#FCEBEA':'#FDF1E7'};color:${i.status==='accepted'?'var(--success)':i.status==='declined'?'var(--danger)':'#B4762A'};">
            ${i.status==='accepted'?t('statusAccepted'):i.status==='declined'?t('statusDeclined'):t('statusPendingShort')}
          </span>
          ${i.status==='pending' ? `
            <div style="margin-top:8px;">
              <button class="mini-btn" data-withdraw="${i.id}" style="background:#fff;color:var(--danger);border:1px solid var(--danger);">${t('withdrawBtn')}</button>
            </div>
          ` : ""}
        </div>
      </div>
    `).join("");
    document.querySelectorAll("[data-withdraw]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm(t('withdrawConfirm'))) return;
        try{ await dataService.cancelInterest(btn.getAttribute("data-withdraw")); showToast(t('withdrawnToast')); loadSent(); }
        catch(err){ showToast("Error: "+err.message); }
      });
    });
  }

  function updateTabBadges(){
    const recPending = receivedList.filter(i=>i.status==='pending').length;
    const sentPending = sentList.filter(i=>i.status==='pending').length;
    const rb = document.getElementById("tab-badge-received"), sb = document.getElementById("tab-badge-sent");
    if(rb){ if(recPending>0){ rb.style.display="inline-flex"; rb.textContent=recPending; } else rb.style.display="none"; }
    if(sb){ if(sentPending>0){ sb.style.display="inline-flex"; sb.textContent=sentPending; } else sb.style.display="none"; }
  }

  function loadReceived(){
    dataService.getReceivedInterests(state.user.id).then(list=>{
      receivedList = list; updateTabBadges();
      if(document.querySelector('.int-tab.active').getAttribute("data-tab")==="received") paintReceived();
    }).catch(err=>{ document.getElementById("int-content").innerHTML = `<div class="status-banner status-err">Data load ના થયું: ${err.message}</div>`; });
  }
  function loadSent(){
    dataService.getSentInterests(state.user.id).then(list=>{
      sentList = list; updateTabBadges();
      if(document.querySelector('.int-tab.active').getAttribute("data-tab")==="sent") paintSent();
    }).catch(err=>{ document.getElementById("int-content").innerHTML = `<div class="status-banner status-err">Data load ના થયું: ${err.message}</div>`; });
  }

  document.querySelectorAll(".int-tab").forEach(tabEl=>{
    tabEl.addEventListener("click", ()=>{
      document.querySelectorAll(".int-tab").forEach(t2=>{ t2.classList.remove("active"); t2.style.color="rgba(255,255,255,0.85)"; });

      document.getElementById("int-content").innerHTML = `<div class="loading">${t('loadingText')}</div>`;
      if(tabEl.getAttribute("data-tab")==="received") paintReceived(); else paintSent();
    });
  });

  loadReceived();
  loadSent();
}

          </div>
        ` : `
          <div style="padding:0 13px 13px;">
            <button class="mini-btn" data-activate="${c.id}" ${activeCount>=4?"disabled":""} style="width:100%;background:${activeCount>=4?'#EEF1F3':'var(--ice)'};color:${activeCount>=4?'var(--text-mid)':'var(--primary)'};${activeCount>=4?'cursor:not-allowed;':''}">
              ${t('reactivateBtn')}
            </button>
            ${activeCount>=4 ? `<div style="font-size:10px;color:var(--text-mid);margin-top:5px;text-align:center;">${t('limitReachedMsg')}</div>` : ""}
          </div>
        `}
      </div>
    `).join("");
    const canAddMore = activeCount < 4;
    el.innerHTML = cardsHtml + (canAddMore ? `
      <div class="card" id="add-candidate" style="cursor:pointer; border:2px dashed var(--sky); background:var(--ice); justify-content:center; align-items:center; padding:24px; display:flex; flex-direction:column; text-align:center;">
        <div style="width:44px;height:44px;border-radius:50%;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;">+</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-top:10px;">${t('addCandidateBtn')}</div>
        <div style="font-size:10.5px;color:var(--text-mid);margin-top:3px;">${t('moreProfilesMsg').replace('{n}', 4-activeCount)}</div>
      </div>
    ` : `<div class="empty">${t('limitFullMsg')}</div>`)
    + `
      <div class="card" style="cursor:default; flex-direction:column; align-items:stretch; margin-top:16px;">
        <div style="padding:14px;">
          <div style="font-size:11.5px;color:var(--text-mid);margin-bottom:10px;">${t('loggedInAs')} <b style="color:var(--navy);">${escapeHtml(state.user.name)}</b> (${escapeHtml(state.user.mobile)})</div>
          <button class="btn" id="logout-btn" style="background:#FCEBEA;color:var(--danger);width:100%;">${t('logoutBtn')}</button>
        </div>
      </div>
    `;
    const addBtn = document.getElementById("add-candidate");
    if(addBtn) addBtn.addEventListener("click", ()=>{ state.formDraft={}; state.editCandidateId=null; state.screen="formStep1"; render(); });
    document.getElementById("logout-btn").addEventListener("click", async ()=>{
      if(!confirm("શું તમે ખરેખર લોગઆઉટ કરવા માંગો છો?")) return;
      await dataService.logout();
      state.user=null;
      state.screen="checking"; render();
    });
    document.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const candidate = list.find(c=>c.id===btn.getAttribute("data-edit"));
        state.editCandidateId = candidate.id;
        state.formDraft = { ...candidate };
        state.screen="formStep1"; render();
      });
    });
    document.querySelectorAll("[data-manage-photos]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const candidate = list.find(c=>c.id===btn.getAttribute("data-manage-photos"));
        state.uploadCandidateId = candidate.id;
        state.uploadCandidatePhotos = (candidate.photos && candidate.photos.length) ? candidate.photos : (candidate.photoURL ? [{ url: candidate.photoURL, path: `candidates/${candidate.id}/photo.jpg` }] : []);
        state.uploadCandidatePhotoVisible = candidate.photoVisible === true;
        state.uploadCandidateDocs = candidate.docs || {};
        state.screen="formDocs"; render();
      });
    });
    document.querySelectorAll("[data-toggle-photo]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const candidateId = btn.getAttribute("data-toggle-photo");
        const currentlyVisible = btn.getAttribute("data-visible")==="1";
        btn.disabled = true;
        try{
          await dataService.setPhotoVisibility(candidateId, !currentlyVisible);
          showToast(currentlyVisible ? "🙈 Photo છુપાવ્યો" : "👁️ Photo દેખાડ્યો");
          renderMyProfiles();
        }catch(err){ showToast("Error: "+err.message); btn.disabled=false; }
      });
    });
    document.querySelectorAll("[data-toggle-siblings]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const candidateId = btn.getAttribute("data-toggle-siblings");
        const currentlyVisible = btn.getAttribute("data-visible")==="1";
        btn.disabled = true;
        try{
          await dataService.setSiblingsVisibility(candidateId, !currentlyVisible);
          showToast(currentlyVisible ? "🙈 ભાઈ-બહેન ની વિગત છુપાવી" : "👁️ ભાઈ-બહેન ની વિગત દેખાડી");
          renderMyProfiles();
        }catch(err){ showToast("Error: "+err.message); btn.disabled=false; }
      });
    });
    document.querySelectorAll("[data-activate]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(activeCount>=4){ showToast("4/4 પ્રોફાઇલ વપરાયેલા — પહેલા બીજો પ્રોફાઇલ ડિએક્ટિવેટ કરો"); return; }
        btn.disabled = true;
        try{
          await dataService.activateCandidate(btn.getAttribute("data-activate"));
          showToast("✓ પ્રોફાઇલ ફરી એક્ટિવ થયું");
          renderMyProfiles();
        }catch(err){ showToast("Error: "+err.message); btn.disabled=false; }
      });
    });
    document.querySelectorAll("[data-deactivate]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("શું તમે ખરેખર આ પ્રોફાઇલ ને 'લગ્ન/સ્થાયી' તરીકે માર્ક કરવા માંગો છો? એ પછી પ્રોફાઇલ બીજા મેમ્બર્સ ને નહીં દેખાય.")) return;
        try{
          await dataService.deactivateCandidate(btn.getAttribute("data-deactivate"));
          showToast("✓ પ્રોફાઇલ ડિએક્ટિવેટ થયું");
          renderMyProfiles();
        }catch(err){ showToast("Error: "+err.message); }
      });
    });
  }).catch(err=>{
    document.getElementById("myp-content").innerHTML = `<div class="status-banner status-err">Data load ના થયું: ${err.message}</div>`;
  });
}

    });
  });
  updateInterestBadge();

  function paintFontOptions(){
    const current = getFontSizePref();
    document.querySelectorAll(".fs-opt").forEach(el=>{
      const active = el.getAttribute("data-fs")===current;
      el.style.background = active ? "#4A1220" : "transparent";
      el.style.color = active ? "#fff" : "var(--primary)";
    });
  }
  paintFontOptions();
  document.querySelectorAll(".fs-opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      localStorage.setItem("sagarSambandhFontSize", el.getAttribute("data-fs"));
      applyFontZoom();
      paintFontOptions();
    });
  });

  const notifDefs = [
    ["interest", "💌", "નવું Interest મળે ત્યારે"],
    ["approval", "✓", "Profile Approve/Reject થાય ત્યારે"],
    ["newMatches", "🆕", "નવી Matching Profiles ઉમેરાય ત્યારે"],
  ];
  dataService.getUserPrefs(state.user.id).then(prefs=>{
    const el = document.getElementById("notif-toggles");
    el.innerHTML = notifDefs.map(([key,icon,label])=>`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);">
        <div style="flex:1;font-size:12.5px;color:var(--text-dark);">${icon} ${label}</div>
        <input type="checkbox" data-notif="${key}" ${prefs[key]?'checked':''} style="width:20px;height:20px;accent-color:var(--navy);flex-shrink:0;">
      </div>
    `).join("");
    document.querySelectorAll("[data-notif]").forEach(cb=>{
      cb.addEventListener("change", async (e)=>{
        const key = cb.getAttribute("data-notif");
        const newPrefs = { ...prefs, [key]: e.target.checked };
        try{ await dataService.updateNotificationPrefs(state.user.id, newPrefs); prefs[key]=e.target.checked; }
        catch(err){ showToast("Error: "+err.message); e.target.checked = !e.target.checked; }
      });
    });
  }).catch(err=>{
    document.getElementById("notif-toggles").innerHTML = `<div class="status-banner status-err">Load ના થયું: ${err.message}</div>`;
  });
}

function renderFormStep1(){
  const d = state.formDraft;
  const gPh = t('genderPh');
  const rPh = t('rashiPh');
  app.innerHTML = `
    ${formHeaderHtml(1, t('formStep1Title'))}
    <div class="content">
      <div class="field">
        <label>${t('nameEnglishLbl')}</label>
        <div class="input-wrap"><input id="ff-name-en" value="${escapeHtml(d.nameEnglish||'')}" placeholder="${t('nameEnglishPh')}" autocomplete="off"></div>
        <div id="ff-name-suggestions" style="display:none;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
      </div>
      <div class="field"><label>${t('candidateName')}</label><div class="input-wrap"><input id="ff-name" value="${escapeHtml(d.name||'')}" placeholder="${t('candidateNamePh')}"></div></div>
      <div class="field"><label>${t('gender')}</label>
        <select id="ff-gender" style="width:100%" data-placeholder="${gPh}">
          <option value=""></option>
          <option value="male" ${d.gender==='male'?'selected':''}>👦 યુવક (Male)</option>
          <option value="female" ${d.gender==='female'?'selected':''}>👧 યુવતી (Female)</option>
        </select>
      </div>
      <div class="field"><label>${t('age')}</label><div class="input-wrap"><input id="ff-age" type="number" min="18" max="70" value="${d.age||''}" placeholder="${t('agePh')}"></div></div>
      <div class="field"><label>${t('fatherName')}</label><div class="input-wrap"><input id="ff-father" value="${escapeHtml(d.fatherName||'')}" placeholder="${t('fatherNamePh')}"></div></div>
      <div class="field"><label>${t('motherName')}</label><div class="input-wrap"><input id="ff-mother" value="${escapeHtml(d.motherName||'')}" placeholder="${t('motherNamePh')}"></div></div>
      <div class="field"><label>${t('rashi')}</label>
        <select id="ff-rashi" style="width:100%" data-placeholder="${rPh}">
          <option value=""></option>
          ${RASHI_DATA.map(r=>`<option value="${r.gu}" data-search="${r.en.toLowerCase()} ${r.gu}" ${d.rashi===r.gu?'selected':''}>${r.gu}</option>`).join("")}
        </select>
      </div>
      <div id="ff-err"></div>
      <button class="btn btn-primary" id="ff-next">${t('nextBtn')}</button>
    </div>
  `;
  initSelect2('ff-gender', { minimumResultsForSearch: Infinity, placeholder: gPh, allowClear: true });

  // Name transliteration — Google Input Tools (free, unofficial-but-widely-used
  // endpoint; same engine Gboard's Gujarati keyboard uses). Debounced, editable
  // suggestions — candidate picks one, or ignores and types ગુજરાતી directly.
  let nameEnDebounce;
  document.getElementById("ff-name-en").addEventListener("input", (e)=>{
    clearTimeout(nameEnDebounce);
    const text = e.target.value.trim();
    const sugEl = document.getElementById("ff-name-suggestions");
    if(!text){ sugEl.style.display="none"; sugEl.innerHTML=""; return; }
    nameEnDebounce = setTimeout(async ()=>{
      try{
        const res = await fetch(`https://inputtools.google.com/request?text=${encodeURIComponent(text)}&itc=gu-t-i0-und&num=5&cp=0&cs=1&ie=utf-8&oe=utf-8`);
        const data = await res.json();
        const suggestions = (data[0]==='SUCCESS' && data[1] && data[1][0]) ? data[1][0][1] : [];
        if(suggestions.length===0){ sugEl.style.display="none"; sugEl.innerHTML=""; return; }
        sugEl.style.display="flex";
        sugEl.innerHTML = suggestions.map(s=>`<span class="chip" data-suggest="${s}" style="cursor:pointer;">${s}</span>`).join("");
        sugEl.querySelectorAll("[data-suggest]").forEach(chip=>{
          chip.addEventListener("click", ()=>{
            document.getElementById("ff-name").value = chip.getAttribute("data-suggest");
          });
        });
      }catch(err){ sugEl.style.display="none"; sugEl.innerHTML=""; }
    }, 350);
  });

  // Rashi: bilingual search — English or Gujarati both work
  const rashiMatcher = function(params, data){
    if(!params.term || params.term.trim() === '') return data;
    if(!data.element) return null;
    const q = params.term.trim().toLowerCase();
    const guText  = (data.text || '').toLowerCase();
    const enText  = ($(data.element).data('search') || '').toLowerCase();
    return (guText.includes(q) || enText.includes(q)) ? data : null;
  };
  initSelect2('ff-rashi', {
    placeholder: rPh,
    allowClear: true,
    matcher: rashiMatcher,
    templateResult: function(data){
      if(!data.id) return data.text; // placeholder row
      const entry = RASHI_DATA.find(r => r.gu === data.id);
      if(!entry) return data.text;
      const en = entry.en.split(' ')[0]; // first English keyword shown as hint
      const $el = $('<span></span>');
      $el.append($('<strong></strong>').text(entry.gu));
      $el.append($('<span style="color:#8A6B6F;font-size:11px;margin-left:8px;font-weight:400;"></span>').text(en));
      return $el;
    },
    templateSelection: function(data){
      // Always show only Gujarati name in the selection box
      if(!data.id) return $('<span style="color:#B5A29C;">'+rPh+'</span>');
      const entry = RASHI_DATA.find(r => r.gu === data.id);
      return entry ? entry.gu : data.id;
    }
  });
  document.getElementById("form-back").addEventListener("click", ()=>{ state.screen="myProfiles"; render(); });
  document.getElementById("ff-next").addEventListener("click", ()=>{
    const name=document.getElementById("ff-name").value.trim();
    const nameEnglish=document.getElementById("ff-name-en").value.trim();
    const gender=(typeof $!=='undefined') ? $('#ff-gender').val() : document.getElementById("ff-gender").value;
    const age=document.getElementById("ff-age").value;
    const fatherName=document.getElementById("ff-father").value.trim();
    const motherName=document.getElementById("ff-mother").value.trim();
    const rashi=(typeof $!=='undefined') ? $('#ff-rashi').val() : document.getElementById("ff-rashi").value;
    const errEl=document.getElementById("ff-err");
    clearFieldErrors(["ff-name","ff-gender","ff-age","ff-father","ff-mother"]);
    if(!name||!gender||!age||!fatherName||!motherName){
      errEl.innerHTML = `<div class="err-text">${t('fillAllFields')}</div>`;
      markFieldErrors([!name&&"ff-name", !gender&&"ff-gender", !age&&"ff-age", !fatherName&&"ff-father", !motherName&&"ff-mother"].filter(Boolean));
      return;
    }
    if(Number(age) < 18 || Number(age) > 70 || !Number.isInteger(Number(age))){
      errEl.innerHTML = `<div class="err-text">${t('ageInvalid')}</div>`; markFieldErrors(["ff-age"]); return;
    }
    Object.assign(state.formDraft, { name, nameEnglish: nameEnglish||null, gender, age:Number(age), fatherName, motherName, rashi });
    state.screen="formStep2"; render();
  });
}

      <div class="detail-row"><span class="k">${t('city')}</span><span class="v">${escapeHtml(d.city)}</span></div>
      <div class="detail-row"><span class="k">${t('maritalStatus')}</span><span class="v">${escapeHtml(d.maritalStatus)}</span></div>
      <div class="declaration" style="margin-top:16px;">
        <span style="font-size:16px;">🔒</span>
        <p>${isEdit ? t('reviewEditNote') : t('reviewNote')}</p>
      </div>
      <div id="ff3-err"></div>
      <button class="btn btn-primary" id="ff3-submit">${isEdit ? t('updateBtn') : t('submitBtn')}</button>
    </div>
  `;
  document.getElementById("form-back").addEventListener("click", ()=>{ state.screen="formStep2"; render(); });
  document.getElementById("ff3-submit").addEventListener("click", async (e)=>{
    e.target.disabled=true; e.target.textContent = isEdit ? t('updating') : t('submitting');
    try{
      if(isEdit){
        await dataService.updateCandidate(state.editCandidateId, state.formDraft);
        showToast(t('updateSuccess'));
        state.formDraft={}; state.editCandidateId=null;
        state.screen="myProfiles"; render();
      } else {
        const result = await dataService.createCandidate(state.user.id, state.formDraft);
        state.formDraft={};
        state.uploadCandidateId = result.id;
        state.uploadCandidatePhotos = [];
        state.uploadCandidatePhotoVisible = false;
        state.uploadCandidateDocs = {};
        showToast(t('submitSuccess'));
        state.screen="formDocs"; render();
      }
    }catch(err){
      e.target.disabled=false; e.target.textContent = isEdit ? t('updateBtn') : t('submitBtn');
      document.getElementById("ff3-err").innerHTML = `<div class="err-text">${err.message}</div>`;
    }
  });
}

function renderFormDocs(){
  const candidateId = state.uploadCandidateId;
  function photoGridHtml(){
    const photos = state.uploadCandidatePhotos || [];
    const tiles = photos.map((p, i)=>`
      <div style="position:relative;width:78px;height:78px;">
        <img src="${p.url}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid var(--sky);">
        <div data-remove-photo="${i}" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.25);">✕</div>
        ${i===0?`<div style="position:absolute;bottom:-6px;left:0;right:0;text-align:center;font-size:8px;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:1px 0;">Cover</div>`:''}
      </div>
    `).join("");
    const addTile = photos.length < 5 ? `
      <label style="width:78px;height:78px;border-radius:12px;border:2px dashed var(--sky);background:var(--ice);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);font-size:22px;">
        +<input type="file" accept="image/*" id="photo-input" style="display:none;">
      </label>
    ` : `<div style="width:78px;height:78px;border-radius:12px;background:var(--ice);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-mid);text-align:center;padding:4px;">મહત્તમ 5/5</div>`;
    return `<div style="display:flex;gap:10px;flex-wrap:wrap;">${tiles}${addTile}</div>`;
  }
  function docRowHtml(key, label){
    const doc = (state.uploadCandidateDocs || {})[key];
    if(doc){
      return `
        <div style="border:1.5px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px;background:#fff;">
          <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:8px;">${label}</div>
          <div style="display:flex;align-items:center;gap:10px;background:var(--ice);border-radius:10px;padding:8px 10px;">
            <span style="font-size:16px;">✓</span>
            <span style="flex:1;font-size:11.5px;color:var(--text-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(doc.name||'file')}</span>
            <div data-remove-doc="${key}" style="width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-shrink:0;">✕</div>
          </div>
          <div id="doc-status-${key}" style="font-size:10.5px;margin-top:6px;font-weight:600;"></div>
        </div>
      `;
    }
    return `
      <div style="border:1.5px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px;background:#fff;">
        <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;">${label}</div>
        <input type="file" accept="image/*,.pdf" data-doc="${key}" style="font-size:11px;">
        <div id="doc-status-${key}" style="font-size:10.5px;color:var(--success);margin-top:6px;font-weight:600;"></div>
      </div>
    `;
  }
  app.innerHTML = `
    ${formHeaderHtml(4, t('docsTitle'))}
    <div class="content">
      <div style="border:2px dashed var(--sky); border-radius:16px; background:var(--ice); padding:16px; margin-bottom:16px;">
        <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:3px;">Photos (મહત્તમ 5)</div>
        <div style="font-size:10.5px;color:var(--text-mid);margin-bottom:12px;">${t('photoPh')} — પહેલો photo Cover Photo ગણાશે</div>
        <div id="photo-grid">${photoGridHtml()}</div>
        <div id="photo-status" style="font-size:10.5px;color:var(--success);margin-top:8px;font-weight:600;"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:14px;">
          <input type="checkbox" id="photo-visible-toggle" ${state.uploadCandidatePhotoVisible?'checked':''} style="accent-color:var(--navy);width:15px;height:15px;">
          <label for="photo-visible-toggle" style="font-size:11px;color:var(--text-dark);font-weight:600;">મારા Photos બીજા members ને દેખાડો</label>
        </div>
        <div style="font-size:10px;color:var(--text-mid);margin-top:3px;">Default: છુપાયેલા — ગમે ત્યારે My Profiles માંથી બદલી શકાય</div>
      </div>

      <div style="font-size:12px;font-weight:700;color:var(--navy);margin:6px 0 10px;">જરૂરી Documents</div>
      <div id="docs-list">
        ${docRowHtml("aadhar","🪪 આધાર કાર્ડ")}
        ${docRowHtml("education","🎓 શિક્ષણ પ્રમાણપત્ર")}
        ${docRowHtml("lc","📄 જન્મ તારીખ દાખલો / LC")}
      </div>

      <div class="declaration" style="margin-top:10px;">
        <span style="font-size:16px;">🔒</span>
        <p>Documents ફક્ત Admin verification માટે વપરાશે. Approve થયા પછી server પરથી delete થઈ જશે — Photos રહેશે.</p>
      </div>
      <button class="btn btn-primary" style="margin-top:16px;" id="docs-done">Done — My Profiles પર જાવ →</button>
    </div>
  `;
  document.getElementById("form-back").addEventListener("click", ()=>{ state.screen="myProfiles"; render(); });

  function attachPhotoGridEvents(){
    const input = document.getElementById("photo-input");
    if(input) input.addEventListener("change", async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const statusEl = document.getElementById("photo-status");
      const err = validateUploadFile(file, { maxMB: 5, allowedTypes: ["image/*"], label: "Photo" });
      if(err){ statusEl.style.color="var(--danger)"; statusEl.textContent = err; e.target.value=""; return; }
      statusEl.style.color = "var(--success)"; statusEl.textContent = "Upload થઈ રહ્યું છે...";
      try{
        const result = await dataService.uploadCandidatePhoto(candidateId, file);
        state.uploadCandidatePhotos = result.photos;
        statusEl.textContent = "✓ ફોટો ઉમેરાયો";
        document.getElementById("photo-grid").innerHTML = photoGridHtml();
        attachPhotoGridEvents();
      }catch(err){ statusEl.style.color="var(--danger)"; statusEl.textContent = "Error: "+err.message; }
    });
    document.querySelectorAll("[data-remove-photo]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const idx = Number(btn.getAttribute("data-remove-photo"));
        const photo = state.uploadCandidatePhotos[idx];
        if(!confirm("આ Photo remove કરવો છે?")) return;
        const statusEl = document.getElementById("photo-status");
        try{
          await dataService.removeCandidatePhoto(candidateId, photo);
          state.uploadCandidatePhotos.splice(idx,1);
          statusEl.style.color="var(--success)"; statusEl.textContent = "✓ ફોટો રિમૂવ થયો";
          document.getElementById("photo-grid").innerHTML = photoGridHtml();
          attachPhotoGridEvents();
        }catch(err){ statusEl.style.color="var(--danger)"; statusEl.textContent = "Error: "+err.message; }
      });
    });
  }
  attachPhotoGridEvents();

  document.getElementById("photo-visible-toggle").addEventListener("change", async (e)=>{
    try{ await dataService.setPhotoVisibility(candidateId, e.target.checked); state.uploadCandidatePhotoVisible = e.target.checked; }
    catch(err){ showToast("Error: "+err.message); e.target.checked = !e.target.checked; }
  });

  function attachDocEvents(){
    document.querySelectorAll("[data-doc]").forEach(input=>{
      input.addEventListener("change", async (e)=>{
        const key = input.getAttribute("data-doc");
        const file = e.target.files[0]; if(!file) return;
        const statusEl = document.getElementById("doc-status-"+key);
        const err = validateUploadFile(file, { maxMB: 8, allowedTypes: ["image/*","application/pdf"], label: "Document" });
        if(err){ statusEl.style.color="var(--danger)"; statusEl.textContent = err; e.target.value=""; return; }
        statusEl.style.color = "var(--success)"; statusEl.textContent = "Upload થઈ રહ્યું છે...";
        try{
          await dataService.uploadDocument(candidateId, key, file);
          state.uploadCandidateDocs = state.uploadCandidateDocs || {};
          state.uploadCandidateDocs[key] = { name: file.name };
          document.getElementById("docs-list").innerHTML =
            docRowHtml("aadhar","🪪 આધાર કાર્ડ") + docRowHtml("education","🎓 શિક્ષણ પ્રમાણપત્ર") + docRowHtml("lc","📄 જન્મ તારીખ દાખલો / LC");
          attachDocEvents();
        }catch(err2){ statusEl.style.color="var(--danger)"; statusEl.textContent = "Error: "+err2.message; }
      });
    });
    document.querySelectorAll("[data-remove-doc]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const key = btn.getAttribute("data-remove-doc");
        if(!confirm("આ Document remove કરવો છે?")) return;
        const statusEl = document.getElementById("doc-status-"+key);
        try{
          await dataService.removeDocument(candidateId, key);
          delete state.uploadCandidateDocs[key];
          document.getElementById("docs-list").innerHTML =
            docRowHtml("aadhar","🪪 આધાર કાર્ડ") + docRowHtml("education","🎓 શિક્ષણ પ્રમાણપત્ર") + docRowHtml("lc","📄 જન્મ તારીખ દાખલો / LC");
          attachDocEvents();
        }catch(err){ statusEl.style.color="var(--danger)"; statusEl.textContent = "Error: "+err.message; }
      });
    });
  }
  attachDocEvents();

  document.getElementById("docs-done").addEventListener("click", ()=>{
    state.uploadCandidateId = null;
    state.uploadCandidatePhotos = [];
    state.uploadCandidateDocs = {};
    state.screen="myProfiles"; render();
  });
}

render();
applyFontZoom();
</script>
</body>
</html>

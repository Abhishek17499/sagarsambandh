const RECAPTCHA_V3_SITE_KEY = "REPLACE_WITH_RECAPTCHA_V3_SITE_KEY";
if (firebaseReady && RECAPTCHA_V3_SITE_KEY !== "REPLACE_WITH_RECAPTCHA_V3_SITE_KEY") {
  try {
    firebase.appCheck().activate(
      new firebase.appCheck.ReCaptchaV3Provider(RECAPTCHA_V3_SITE_KEY),

    );
  } catch (e) { console.warn("App Check activation failed:", e.message); }
}

let authReadyPromise = firebaseReady
  ? new Promise((resolve) => {
      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          try { await auth.signInAnonymously(); }
          catch (e) { firebaseError = "Auth failed: " + e.message; }
        }
        resolve();
      });
    })
  : Promise.resolve();

function mobileToEmail(mobile){ return `${mobile}@sagarsambandh.local`; }
function pinToPassword(pin){ return `sagar${pin}bandh`; }

// ============================================================
// DATA SERVICE — Firestore calls
// ============================================================
const dataService = {
  async signup(mobile, pin, name, village) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    let cred;
    try {
      cred = await auth.createUserWithEmailAndPassword(mobileToEmail(mobile), pinToPassword(pin));
    } catch (e) {
      if (e.code === "auth/email-already-in-use") throw new Error("આ Mobile Number થી પહેલેથી account છે — Login કરો");
      throw new Error(e.message || "Account બની ના શક્યું");
    }
    await db.collection("users").doc(cred.user.uid).set({
      name, village, mobile, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { id: cred.user.uid, name, mobile, village };
  },

  async login(mobile, pin) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    let cred;
    try {
      cred = await auth.signInWithEmailAndPassword(mobileToEmail(mobile), pinToPassword(pin));
    } catch (e) {
      if (e.code === "auth/user-not-found") throw new Error("આ Mobile Number થી કોઈ account નથી — 'નવું Account બનાવો' પસંદ કરો");
      if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") throw new Error("PIN ખોટો છે");
      throw new Error(e.message || "Login ના થયું");
    }
    const doc = await db.collection("users").doc(cred.user.uid).get();
    if (!doc.exists) throw new Error("Account ડેટા ના મળ્યો — Admin નો સંપર્ક કરો");
    const data = doc.data();
    if (data.blocked) {
      await auth.signOut();
      throw new Error("તમારું account block કરવામાં આવ્યું છે. Admin નો સંપર્ક કરો.");
    }
    return { id: cred.user.uid, name: data.name, mobile: data.mobile, village: data.village };
  },

  async logout() {
    if (auth) await auth.signOut();
  },

  async getProfiles(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("candidates").where("status", "==", "approved").get();
    let profiles = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.deactivated);

    let myRef = null;
    if (userId) {
      const mySnap = await db.collection("candidates").where("createdByUserId", "==", userId).get();
      const myCandidates = mySnap.docs.map(d => d.data());
      if (myCandidates.length > 0) myRef = myCandidates[0];
    }
    const COMPATIBLE_RASHI = {
      "મેષ":["સિંહ","ધન"], "વૃષભ":["કન્યા","મકર"], "મિથુન":["તુલા","કુંભ"], "કર્ક":["વૃશ્ચિક","મીન"],
      "સિંહ":["મેષ","ધન"], "કન્યા":["વૃષભ","મકર"], "તુલા":["મિથુન","કુંભ"], "વૃશ્ચિક":["કર્ક","મીન"],
      "ધન":["મેષ","સિંહ"], "મકર":["વૃષભ","કન્યા"], "કુંભ":["મિથુન","તુલા"], "મીન":["કર્ક","વૃશ્ચિક"],
    };
    profiles = profiles.map(p => {
      if (!myRef) return { ...p, matchScore: null };
      let score = 0;
      if (myRef.city && p.city && myRef.city === p.city) score += 1;
      const ageDiff = Math.abs((myRef.age||0) - (p.age||0));
      if (ageDiff <= 5) score += 2; else if (ageDiff <= 8) score += 1;
      if (myRef.rashi && p.rashi) {
        if (myRef.rashi === p.rashi) score += 1;
        else if ((COMPATIBLE_RASHI[myRef.rashi]||[]).includes(p.rashi)) score += 1.5;
      }
      if (myRef.education && p.education && myRef.education === p.education) score += 1;
      const finalScore = Math.min(5, Math.round(score * 2) / 2);
      return { ...p, matchScore: finalScore };
    });
    return profiles;
  },

  async getProfileById(id) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const d = await db.collection("candidates").doc(id).get();
    if (!d.exists) return null;
    return { id: d.id, ...d.data() };
  },

  async sendInterest(userId, candidateId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("interests").add({
      fromUserId: userId, toCandidateId: candidateId, status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { success: true };
  },

  async getReceivedInterests(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const myCandidates = await db.collection("candidates").where("createdByUserId", "==", userId).get();
    const myCandidateIds = myCandidates.docs.map(d => d.id);
    const candidateNameById = {};
    myCandidates.docs.forEach(d => { candidateNameById[d.id] = d.data().name; });
    if (myCandidateIds.length === 0) return [];
    const results = [];
    for (const cid of myCandidateIds) {
      const snap = await db.collection("interests").where("toCandidateId", "==", cid).get();
      for (const d of snap.docs) {
        const data = d.data();
        let fromUserName = "સભ્ય";
        try {
          const fromUserDoc = await db.collection("users").doc(data.fromUserId).get();
          if (fromUserDoc.exists) fromUserName = fromUserDoc.data().name;
        } catch(e){}
        results.push({ id: d.id, ...data, forCandidateName: candidateNameById[cid], fromUserName });
      }
    }
    return results.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  async respondToInterest(interestId, response) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("interests").doc(interestId).update({ status: response });
    return { success: true };
  },

  async getMyCandidates(userId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const snap = await db.collection("candidates").where("createdByUserId", "==", userId).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  },

  async deactivateCandidate(candidateId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("candidates").doc(candidateId).update({ deactivated: true });
    return { success: true };
  },

  async activateCandidate(candidateId) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("candidates").doc(candidateId).update({ deactivated: false });
    return { success: true };
  },

  async updateCandidate(candidateId, payload) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("candidates").doc(candidateId).update({
      ...payload,
      status: "pending",
    });
    return { success: true };
  },

  async uploadPhoto(candidateId, file) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const ref = storage.ref().child(`candidates/${candidateId}/photo.jpg`);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection("candidates").doc(candidateId).update({
      photoURL: url,
      status: "pending",
    });
    return url;
  },

  async uploadDocument(candidateId, docKey, file) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const ref = storage.ref().child(`candidates/${candidateId}/docs/${docKey}`);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection("candidates").doc(candidateId).update({
      [`docs.${docKey}`]: { url, uploadedAt: new Date().toISOString(), name: file.name },
      status: "pending",
    });
    return url;
  },

  async createCandidate(userId, payload) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    const existing = await db.collection("candidates").where("createdByUserId", "==", userId).get();
    const activeCount = existing.docs.filter(d => !d.data().deactivated).length;
    if (activeCount >= 4) throw new Error("એક account થી વધુમાં વધુ 4 active profiles બની શકે છે");
    const photoStyles = [
      { color:"linear-gradient(145deg, #145C82 0%, #0C2A46 100%)", emoji: payload.gender==="female" ? "👧" : "👦" },
    ];
    const ref = await db.collection("candidates").add({
      ...payload,
      createdByUserId: userId,
      status: "pending",
      photoVisible: false,
      photoColor: photoStyles[0].color,
      photoEmoji: photoStyles[0].emoji,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return { id: ref.id };
  },

  async setPhotoVisibility(candidateId, visible) {
    if (!firebaseReady) throw new Error(firebaseError || "Firebase load ના થયું");
    await db.collection("candidates").doc(candidateId).update({ photoVisible: visible });
    return { success: true };
  },
};

function langToggleHtml(){
  return `
    <div class="flex items-center bg-white/20 backdrop-blur-md rounded-full p-1 border border-white/30 text-[11px] font-semibold">

  `;
}

function attachLangToggle(){
  document.querySelectorAll("[data-lang-btn]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.lang = el.getAttribute("data-lang-btn");
      render();
    });
  });
}

function showToast(msg){
  const existing = document.querySelector(".toast");
  if(existing) existing.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2800);
}

function bottomNavHtml(active){
  const items = [

          const isActive = active === item.key;
          return `
            <button data-nav="${item.key}" class="flex flex-col items-center gap-0.5 transition-transform active:scale-95 ${isActive ? 'text-deep-ocean font-bold' : 'text-on-surface-variant hover:text-deep-ocean'}">

function attachNavEvents(){
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => {

      if (k === "home") { state.screen = "home"; render(); }

      else if (k === "interest") { state.screen = "interest"; render(); }
    });
  });
}

  else if(state.screen==="loginPin") renderLoginPin();

}

        </div>
      </div>
      <h1 class="font-display text-2xl font-bold text-deep-ocean tracking-tight">સાગર સંબંધ</h1>
      <p class="font-sans text-xs text-on-surface-variant mt-1.5 font-medium">પોરબંદર ખારવા સમાજ મેટ્રિમોનિઅલ પોર્ટલ</p>
      
      <div class="mt-8 flex items-center gap-2 text-xs text-horizon-blue font-semibold bg-white/80 border border-soft-sky px-4 py-2 rounded-full shadow-sm">
        <span class="material-symbols-outlined text-base animate-spin">progress_activity</span>
        <span>કનેક્શન ચકાસી રહ્યા છીએ...</span>
      </div>
    </div>
  `;

  setTimeout(async ()=>{
    if(!firebaseReady){
      app.innerHTML = `
        <div class="p-6 bg-cream-base flex-1 flex flex-col justify-center text-center">
          <div class="w-14 h-14 mx-auto rounded-full bg-red-100 text-danger flex items-center justify-center mb-4">
            <span class="material-symbols-outlined text-3xl">cloud_off</span>
          </div>
          <h2 class="font-display text-xl font-bold text-deep-ocean">કનેક્શન ક્ષતિ (Connection Issue)</h2>
          <p class="text-xs text-on-surface-variant mt-2 max-w-xs mx-auto">Firebase સેવાઓ લોડ થઈ શકી નથી. કૃપા કરીને ઇન્ટરનેટ કનેક્શન તપાસો અથવા પેજ રિફ્રેશ કરો.</p>
          <p class="text-[11px] text-danger mt-3 bg-red-50 p-3 rounded-xl border border-red-200">${firebaseError || "Unknown error"}</p>
          <button onclick="location.reload()" class="mt-6 bg-deep-ocean text-white font-bold py-3 px-6 rounded-xl text-sm shadow-sm hover:bg-horizon-blue transition-all">
            ફરી પ્રયાસ કરો (Retry)
          </button>
        </div>
      `;
      return;
    }

    await authReadyPromise;
    const currentUser = auth.currentUser;
    if(currentUser && !currentUser.isAnonymous){
      try{
        const userDoc = await db.collection("users").doc(currentUser.uid).get();
        if(userDoc.exists){
          const data = userDoc.data();
          if(!data.blocked){
            state.user = { id: currentUser.uid, name: data.name, mobile: data.mobile, village: data.village };
            state.screen = "home";
            render();
            return;
          }
        }
      }catch(e){}
    }
    state.screen = "mobileEntry";
    render();
  }, 400);
}

          </div>

          </p>

          <div class="flex justify-center gap-3 my-8">
            ${[0,1,2,3].map(i=>`<input class="otp-box font-sans" maxlength="1" inputmode="numeric" type="password" data-pin="${i}">`).join("")}
          </div>

          <div id="pin-err"></div>

          <button id="pin-submit" disabled class="w-full mt-2 bg-earth-warmth hover:bg-earth-dark disabled:opacity-50 disabled:cursor-not-allowed text-white py-3.5 rounded-xl text-sm font-bold shadow-ambient transition-all flex items-center justify-center gap-2">
            <span>Login કરો</span>
            <span class="material-symbols-outlined text-base">arrow_forward</span>
          </button>
        </div>
      </div>

      <div class="text-center text-xs text-on-surface-variant py-4">
        PIN ભૂલી ગયા છો? સહાયતા માટે એડમિનનો સંપર્ક કરો.
      </div>
    </div>
  `;

  const boxes = Array.from(document.querySelectorAll("[data-pin]"));
  const submitBtn = document.getElementById("pin-submit");
  function checkFull(){ submitBtn.disabled = boxes.some(b=>!b.value); }

  boxes.forEach((b,i)=>{
    b.addEventListener("input", ()=>{
      b.value = b.value.replace(/\D/g,'').slice(0,1);
      if(b.value && boxes[i+1]) boxes[i+1].focus();
      checkFull();
    });
    b.addEventListener("keydown", (e)=>{
      if(e.key === "Backspace" && !b.value && boxes[i-1]){
        boxes[i-1].focus();
      }
    });
  });
  if(boxes[0]) setTimeout(()=> boxes[0].focus(), 150);

  document.getElementById("pin-back").addEventListener("click", ()=>{ state.screen = "mobileEntry"; render(); });

  submitBtn.addEventListener("click", async (e)=>{
    const pin = boxes.map(b=>b.value).join("");
    const errEl = document.getElementById("pin-err");
    errEl.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="material-symbols-outlined text-base animate-spin">progress_activity</span><span>લૉગિન થઈ રહ્યા છીએ...</span>`;
    try{
      const result = await dataService.login(state.pendingMobile, pin);
      state.user = result;
      showToast(`નમસ્તે ${result.name || "સભ્ય"}! સ્વાગત છે 🙏`);
      state.screen = "home";
      render();
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>Login કરો</span><span class="material-symbols-outlined text-base">arrow_forward</span>`;
      boxes.forEach(b=>b.value="");
      if(boxes[0]) boxes[0].focus();
      errEl.innerHTML = `<div class="bg-red-50 text-danger text-xs font-semibold p-3 rounded-xl border border-red-200 mb-3 flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">error</span>${err.message}</div>`;
    }
  });
}

  document.getElementById("cp-submit").addEventListener("click", async (e)=>{
    const name = document.getElementById("cp-name").value.trim();
    const village = document.getElementById("cp-village").value.trim();
    const pin = document.getElementById("cp-pin").value.trim();
    const pin2 = document.getElementById("cp-pin2").value.trim();
    const agreed = document.getElementById("cp-agree").checked;

    btn.innerHTML = `<span class="material-symbols-outlined text-base animate-spin">progress_activity</span><span>ખાતું બની રહ્યું છે...</span>`;

      showToast("ખાતું સફળતાપૂર્વક બની ગયું! 🙏");
      state.screen = "home";
      render();
    }catch(err){
      btn.disabled = false;
      btn.innerHTML = `<span>ખાતું બનાવો અને આગળ વધો</span><span class="material-symbols-outlined text-base">check_circle</span>`;
      errEl.innerHTML = `<div class="bg-red-50 text-danger text-xs font-semibold p-2.5 rounded-xl border border-red-200">${err.message}</div>`;
    }
  });
}

    <!-- Content Feed Container -->

    if(list.length === 0){

          <p class="text-xs text-on-surface-variant mt-1">તમારા સર્ચ અથવા ફિલ્ટર અનુસાર કોઈ ઉમેદવાર ઉપલબ્ધ નથી.</p>

      <div class="space-y-5">
        ${list.map(p => {
          const showPhoto = p.photoVisible !== false && p.photoURL;
          const matchPercent = p.matchScore != null ? Math.round((p.matchScore / 5) * 100) : null;

          return `
            <article class="bg-white rounded-3xl overflow-hidden shadow-ambient border border-soft-sky/70 transition-all duration-200 hover:shadow-ambient-lg cursor-pointer group" data-open="${p.id}">

              <div class="relative w-full h-64 sm:h-72 bg-gradient-to-br from-deep-ocean to-horizon-blue overflow-hidden flex items-center justify-center">
                ${showPhoto ? `
                  <img src="${p.photoURL}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                ` : `
                  <div class="text-center p-6">
                    <div class="w-20 h-20 mx-auto rounded-full bg-white/15 backdrop-blur-md flex items-center justify-center text-4xl mb-2 border border-white/20">
                      ${p.photoEmoji || (p.gender === 'female' ? '👧' : '👦')}
                    </div>
                    <span class="inline-block bg-white/20 backdrop-blur-md text-white text-[11px] font-semibold px-3 py-1 rounded-full border border-white/20">
                      🔒 ફોટો ઉમેદવારે છુપાવેલ છે
                    </span>
                  </div>
                `}

                <!-- Top Left Verified Badge -->
                <div class="absolute top-3.5 left-3.5 bg-white/95 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-1 border border-soft-sky shadow-sm">
                  <span class="material-symbols-outlined text-earth-warmth text-sm material-symbols-fill">verified</span>
                  <span class="text-[11px] font-bold text-deep-ocean">Verified</span>
                </div>

                <!-- Top Right Match Score Badge -->
                ${matchPercent != null ? `
                  <div class="absolute top-3.5 right-3.5 bg-deep-ocean/90 backdrop-blur-md text-white px-3 py-1 rounded-full flex items-center gap-1 border border-white/20 shadow-sm">

                    <span class="text-[11px] font-bold">${matchPercent}% Match</span>
                  </div>
                ` : ''}

                <!-- Bottom Wave SVG Divider -->
                <div class="absolute bottom-0 w-full leading-none">
                  ${waveDividerSvg("text-white")}
                </div>
              </div>

              <!-- Card Body Content -->
              <div class="p-5 pt-2">
                <div class="flex items-baseline justify-between mb-1.5">
                  <h2 class="font-display text-xl font-bold text-deep-ocean tracking-tight">
                    ${p.name}, <span class="font-sans text-base font-medium text-on-surface-variant">${p.age} વર્ષ</span>
                  </h2>
                </div>

                <div class="flex flex-wrap items-center gap-y-1 gap-x-3 text-xs text-on-surface-variant font-medium mb-3.5">
                  <span class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm text-earth-warmth">work</span>
                    ${p.occupation || 'Private'}
                  </span>
                  <span>•</span>
                  <span class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm text-earth-warmth">location_on</span>
                    ${p.city || '-'}
                  </span>
                </div>

                <!-- Tags Row -->
                <div class="flex flex-wrap gap-1.5 mb-4">
                  <span class="bg-soft-sky/40 text-horizon-blue border border-soft-sky px-2.5 py-1 rounded-full text-[11px] font-semibold">
                    ${p.education || '-'}
                  </span>
                  <span class="bg-soft-sky/40 text-horizon-blue border border-soft-sky px-2.5 py-1 rounded-full text-[11px] font-semibold">
                    ${p.rashi ? `રાશી: ${p.rashi}` : 'પોરબંદર ખારવા'}
                  </span>
                  <span class="bg-soft-sky/40 text-horizon-blue border border-soft-sky px-2.5 py-1 rounded-full text-[11px] font-semibold">
                    ${p.maritalStatus || 'કુંવારા'}
                  </span>
                </div>

                <!-- Action Button -->
                <div class="flex gap-2">
                  <button class="flex-1 bg-surface hover:bg-soft-sky/30 border border-soft-sky text-deep-ocean font-bold py-2.5 px-4 rounded-xl text-xs transition-colors flex items-center justify-center gap-1.5">
                    <span>સંપૂર્ણ વિગત જુઓ</span>
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                  </button>
                  <button data-quick-int="${p.id}" class="bg-earth-warmth hover:bg-earth-dark text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors flex items-center justify-center gap-1 shadow-sm">
                    <span class="material-symbols-outlined text-sm material-symbols-fill">favorite</span>
                    <span>Interest</span>
                  </button>
                </div>
              </div>
            </article>

        }).join("")}

    // Click Card to open detail
    document.querySelectorAll("[data-open]").forEach(card => {
      card.addEventListener("click", (e)=>{
        if(e.target.closest("[data-quick-int]")) return;
        state.openProfileId = card.getAttribute("data-open");
        state.screen = "detail";
        render();
      });
    });

    // Quick Interest Action
    document.querySelectorAll("[data-quick-int]").forEach(btn => {
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const cid = btn.getAttribute("data-quick-int");
        btn.disabled = true;
        try {
          await dataService.sendInterest(state.user.id, cid);
          showToast("💌 Interest વિનંતી સફળતાપૂર્વક મોકલાઈ ગઈ!");
          btn.innerHTML = `<span class="material-symbols-outlined text-sm">check</span><span>મોકલાયું</span>`;
          btn.classList.replace("bg-earth-warmth", "bg-success");
        } catch(err) {
          showToast("Error: " + err.message);
          btn.disabled = false;
        }
      });
    });
  }

  function applyFilters(){
    const searchInput = document.getElementById("home-search");
    const q = searchInput ? searchInput.value.trim().toLowerCase() : "";
    const clearBtn = document.getElementById("search-clear");
    if(clearBtn) clearBtn.classList.toggle("hidden", !q);

    let list = allProfiles;
    if(activeGender) list = list.filter(p => p.gender === activeGender);
    if(q){
      list = list.filter(p =>
        (p.name||"").toLowerCase().includes(q) ||
        (p.city||"").toLowerCase().includes(q) ||
        (p.occupation||"").toLowerCase().includes(q) ||
        (p.education||"").toLowerCase().includes(q) ||
        (p.rashi||"").toLowerCase().includes(q)
      );
    }
    if(sortByMatch) list = [...list].sort((a,b) => (b.matchScore||0) - (a.matchScore||0));
    paintList(list);
  }

  document.querySelectorAll("[data-gender]").forEach(chip => {
    chip.addEventListener("click", ()=>{
      document.querySelectorAll("[data-gender]").forEach(c => {
        c.classList.remove("active", "bg-deep-ocean", "text-white", "border-deep-ocean");
        c.classList.add("bg-white", "text-deep-ocean", "border-soft-sky");
      });
      chip.classList.add("active", "bg-deep-ocean", "text-white", "border-deep-ocean");
      chip.classList.remove("bg-white", "text-deep-ocean", "border-soft-sky");
      activeGender = chip.getAttribute("data-gender");
      applyFilters();
    });
  });

  const sortChip = document.querySelector("[data-sort='match']");
  sortChip.addEventListener("click", ()=>{
    sortByMatch = !sortByMatch;
    if(sortByMatch){
      sortChip.classList.add("bg-deep-ocean", "text-white", "border-deep-ocean");
      sortChip.classList.remove("bg-white", "text-deep-ocean", "border-soft-sky");
    } else {
      sortChip.classList.remove("bg-deep-ocean", "text-white", "border-deep-ocean");
      sortChip.classList.add("bg-white", "text-deep-ocean", "border-soft-sky");
    }
    applyFilters();
  });

  const searchInput = document.getElementById("home-search");
  searchInput.addEventListener("input", applyFilters);
  document.getElementById("search-clear").addEventListener("click", ()=>{
    searchInput.value = "";
    applyFilters();
    searchInput.focus();
  });

  dataService.getProfiles(state.user?.id).then(profiles => {
    allProfiles = profiles;
    paintList(allProfiles);
  }).catch(err => {
    const el = document.getElementById("home-content");
    if(el) el.innerHTML = `<div class="bg-red-50 text-danger p-4 rounded-2xl border border-red-200 text-xs font-semibold text-center">ડેટા લોડ થઈ શક્યો નહીં: ${err.message}</div>`;
  });
}

function renderInterest(){
  app.innerHTML = `
    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-soft-sky/80 px-5 pt-4 pb-3">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="font-display font-bold text-deep-ocean text-xl">${t('interestsTitle')}</h1>
          <p class="text-[11px] text-on-surface-variant font-medium">${t('interestsSub')}</p>
        </div>
        ${langToggleHtml()}
      </div>
    </header>

    <main class="flex-1 p-5 pb-28" id="int-content">
      <div class="py-16 text-center text-on-surface-variant flex flex-col items-center justify-center">
        <span class="material-symbols-outlined text-3xl animate-spin text-horizon-blue mb-2">progress_activity</span>
        <span class="text-xs font-semibold">વિનંતીઓ લોડ થઈ રહી છે...</span>
      </div>
    </main>

    ${bottomNavHtml("interest")}
  `;

  attachLangToggle();
  attachNavEvents();

  dataService.getReceivedInterests(state.user.id).then(list => {
    const el = document.getElementById("int-content");
    if(!el) return;

    if(list.length === 0){
      el.innerHTML = `
        <div class="bg-white rounded-3xl p-8 text-center border border-soft-sky shadow-ambient my-8">
          <div class="w-14 h-14 mx-auto rounded-full bg-soft-sky/40 text-horizon-blue flex items-center justify-center mb-3">
            <span class="material-symbols-outlined text-3xl">mark_email_unread</span>
          </div>
          <h3 class="font-display font-bold text-deep-ocean text-lg">હજુ કોઈ Interest નથી</h3>
          <p class="text-xs text-on-surface-variant mt-1.5 leading-relaxed">
            તમારા ઉમેદવાર પ્રોફાઇલ માટે જ્યારે અન્ય સભ્યો રસ દાખવશે, ત્યારે તે તમામ વિનંતીઓ અહીં દેખાશે.
          </p>
        </div>
      `;
      return;
    }

    el.innerHTML = `
      <div class="space-y-4">
        ${list.map(i => {
          const isPending = i.status === 'pending';
          const isAccepted = i.status === 'accepted';
          const isDeclined = i.status === 'declined';

          return `
            <div class="bg-white rounded-3xl p-5 shadow-ambient border border-soft-sky/60">
              <div class="flex items-start justify-between mb-3">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-deep-ocean to-horizon-blue flex items-center justify-center text-white text-xl shadow-sm">
                    👤
                  </div>
                  <div>
                    <h3 class="font-display font-bold text-deep-ocean text-base">${i.fromUserName}</h3>
                    <p class="text-[11px] text-on-surface-variant font-medium">તમારા <b>"${i.forCandidateName}"</b> પ્રોફાઇલ માટે</p>
                  </div>
                </div>

                <span class="px-3 py-1 rounded-full text-[11px] font-bold ${
                  isAccepted ? 'bg-green-50 text-success border border-green-200' :
                  isDeclined ? 'bg-red-50 text-danger border border-red-200' :
                  'bg-amber-50 text-amber-700 border border-amber-200'
                }">
                  ${isAccepted ? '✓ સ્વીકારેલ (Accepted)' : isDeclined ? '✕ નકારેલ (Declined)' : '⏳ પ્રતીક્ષિત (Pending)'}
                </span>
              </div>

              ${isPending ? `
                <div class="flex gap-2 pt-2 border-t border-soft-sky/50 mt-3">
                  <button data-accept="${i.id}" class="flex-1 bg-success hover:opacity-90 text-white font-bold py-2.5 rounded-xl text-xs transition-opacity flex items-center justify-center gap-1 shadow-sm">
                    <span class="material-symbols-outlined text-sm">check</span>
                    <span>Accept કરો</span>
                  </button>
                  <button data-decline="${i.id}" class="flex-1 bg-surface hover:bg-red-50 text-danger border border-red-200 font-bold py-2.5 rounded-xl text-xs transition-colors flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-sm">close</span>
                    <span>Decline</span>
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join("")}
      </div>
    `;

    document.querySelectorAll("[data-accept]").forEach(btn => {
      btn.addEventListener("click", async ()=>{
        btn.disabled = true;
        try{
          await dataService.respondToInterest(btn.getAttribute("data-accept"), "accepted");
          showToast("✓ Interest સફળતાપૂર્વક Accept થયું");
          renderInterest();
        }catch(err){
          showToast("Error: " + err.message);
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll("[data-decline]").forEach(btn => {
      btn.addEventListener("click", async ()=>{
        btn.disabled = true;
        try{
          await dataService.respondToInterest(btn.getAttribute("data-decline"), "declined");
          showToast("Interest Decline કરવામાં આવ્યું");
          renderInterest();
        }catch(err){
          showToast("Error: " + err.message);
          btn.disabled = false;
        }
      });
    });
  }).catch(err => {
    const el = document.getElementById("int-content");
    if(el) el.innerHTML = `<div class="bg-red-50 text-danger p-4 rounded-2xl border border-red-200 text-xs font-semibold text-center">${err.message}</div>`;
  });
}

              </button>
            </div>
          ` : `
            <div class="pt-2 border-t border-soft-sky/60">
              <button data-activate="${c.id}" ${activeCount>=4 ? 'disabled' : ''}
                class="w-full bg-surface hover:bg-soft-sky/40 text-deep-ocean border border-soft-sky py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1 disabled:opacity-50">
                <span class="material-symbols-outlined text-sm">replay</span>
                <span>ફરી સક્રિય કરો (Reactivate)</span>
              </button>
            </div>
          `}
        </div>

    }).join("");

    el.innerHTML = `

        ` : `
          <div class="bg-amber-50 text-amber-800 text-xs font-semibold p-4 rounded-2xl border border-amber-200 text-center">

          </div>
        `}

        <!-- Account Info & Logout Card -->
        <div class="bg-white rounded-3xl p-5 shadow-ambient border border-soft-sky/60 mt-6">

              <div class="w-10 h-10 rounded-full bg-soft-sky/50 text-deep-ocean flex items-center justify-center font-bold text-sm">
                ${state.user.name?.charAt(0) || '👤'}
              </div>
              <div>
                <h4 class="font-bold text-deep-ocean text-sm">${state.user.name}</h4>
                <p class="text-[11px] text-on-surface-variant font-medium">+91 ${state.user.mobile} • ${state.user.village || 'પોરબંદર'}</p>
              </div>
            </div>
          </div>

          <button id="logout-btn" class="w-full bg-red-50 hover:bg-red-100 text-danger border border-red-200 py-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-base">logout</span>
            <span>લૉગઆઉટ (Logout)</span>
          </button>
        </div>
      </div>
    `;

    const addBtn = document.getElementById("add-candidate");
    if(addBtn) {
      addBtn.addEventListener("click", ()=>{
        state.formDraft = {};
        state.editCandidateId = null;
        state.screen = "formStep1";
        render();
      });
    }

    document.getElementById("logout-btn").addEventListener("click", async ()=>{
      if(!confirm("શું તમે ખરેખર લૉગઆઉટ કરવા માંગો છો?")) return;
      await dataService.logout();
      state.user = null;
      state.screen = "mobileEntry";
      render();
    });

    document.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", ()=>{
        const candidate = list.find(c => c.id === btn.getAttribute("data-edit"));
        state.editCandidateId = candidate.id;
        state.formDraft = { ...candidate };
        state.screen = "formStep1";
        render();
      });
    });

    document.querySelectorAll("[data-toggle-photo]").forEach(btn => {
      btn.addEventListener("click", async ()=>{
        const cid = btn.getAttribute("data-toggle-photo");
        const isVisible = btn.getAttribute("data-visible") === "1";
        btn.disabled = true;
        try{
          await dataService.setPhotoVisibility(cid, !isVisible);
          showToast(isVisible ? "🙈 Photo છુપાવ્યો" : "👁️ Photo સભ્યોને દેખાડ્યો");
          renderMyProfiles();
        }catch(err){
          showToast("Error: " + err.message);
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll("[data-activate]").forEach(btn => {
      btn.addEventListener("click", async ()=>{
        btn.disabled = true;
        try{
          await dataService.activateCandidate(btn.getAttribute("data-activate"));
          showToast("✓ Profile ફરી સક્રિય થયું");
          renderMyProfiles();
        }catch(err){
          showToast("Error: " + err.message);
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll("[data-deactivate]").forEach(btn => {
      btn.addEventListener("click", async ()=>{

          await dataService.deactivateCandidate(btn.getAttribute("data-deactivate"));
          showToast("✓ Profile સેટલ્ડ/ડિએક્ટિવેટ થયું");
          renderMyProfiles();
        }catch(err){
          showToast("Error: " + err.message);
        }
      });
    });

function initSelect2(id, opts){
  if(typeof $ === 'undefined') return;
  $(`#${id}`).select2(Object.assign({
    dropdownParent: $('#app'),
    width: '100%',
    language: { noResults: ()=>"કોઈ વિકલ્પ નથી" }
  }, opts));
}

// --- Step 1: Personal & Family ---
function renderFormStep1(){
  const d = state.formDraft;
  const gPh = t('genderPh');
  const rPh = t('rashiPh');

  app.innerHTML = `
    ${formHeaderHtml(1, t('formStep1Title'))}

    <main class="flex-1 p-5 pb-12 space-y-4">
      <div class="bg-white rounded-3xl p-6 shadow-ambient border border-soft-sky/60 space-y-4">
        <div>
          <label class="block text-xs font-bold text-deep-ocean mb-1.5">${t('candidateName')}</label>
          <input id="ff-name" value="${d.name||''}" placeholder="${t('candidateNamePh')}"
            class="w-full px-4 py-3 rounded-xl border border-soft-sky bg-surface/50 font-sans text-xs sm:text-sm text-deep-ocean input-glow transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-deep-ocean mb-1.5">${t('gender')}</label>
          <select id="ff-gender" style="width:100%" data-placeholder="${gPh}">
            <option value=""></option>
            <option value="male" ${d.gender==='male'?'selected':''}>👦 યુવક (Male)</option>
            <option value="female" ${d.gender==='female'?'selected':''}>👧 યુવતી (Female)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-deep-ocean mb-1.5">${t('age')}</label>
          <input id="ff-age" type="number" value="${d.age||''}" placeholder="${t('agePh')}"
            class="w-full px-4 py-3 rounded-xl border border-soft-sky bg-surface/50 font-sans text-xs sm:text-sm text-deep-ocean input-glow transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-deep-ocean mb-1.5">${t('fatherName')}</label>
          <input id="ff-father" value="${d.fatherName||''}" placeholder="${t('fatherNamePh')}"
            class="w-full px-4 py-3 rounded-xl border border-soft-sky bg-surface/50 font-sans text-xs sm:text-sm text-deep-ocean input-glow transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-deep-ocean mb-1.5">${t('motherName')}</label>
          <input id="ff-mother" value="${d.motherName||''}" placeholder="${t('motherNamePh')}"
            class="w-full px-4 py-3 rounded-xl border border-soft-sky bg-surface/50 font-sans text-xs sm:text-sm text-deep-ocean input-glow transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-deep-ocean mb-1.5">${t('rashi')}</label>
          <select id="ff-rashi" style="width:100%" data-placeholder="${rPh}">
            <option value=""></option>
            ${RASHI_DATA.map(r=>`<option value="${r.gu}" data-search="${r.en.toLowerCase()} ${r.gu}" ${d.rashi===r.gu?'selected':''}>${r.gu}</option>`).join("")}
          </select>
        </div>

        <div id="ff-err"></div>

        <button id="ff-next" class="w-full mt-2 bg-earth-warmth hover:bg-earth-dark text-white py-3.5 rounded-xl text-sm font-bold shadow-ambient transition-all flex items-center justify-center gap-2">
          <span>${t('nextBtn')}</span>
          <span class="material-symbols-outlined text-base">arrow_forward</span>
        </button>
      </div>
    </main>
  `;

  initSelect2('ff-gender', { minimumResultsForSearch: Infinity, placeholder: gPh, allowClear: true });

  const rashiMatcher = function(params, data){
    if(!params.term || params.term.trim() === '') return data;
    if(!data.element) return null;
    const q = params.term.trim().toLowerCase();
    const guText  = (data.text || '').toLowerCase();
    const enText  = ($(data.element).data('search') || '').toLowerCase();
    return (guText.includes(q) || enText.includes(q)) ? data : null;
  };

  initSelect2('ff-rashi', {
    placeholder: rPh,
    allowClear: true,
    matcher: rashiMatcher,
    templateResult: function(data){
      if(!data.id) return data.text;
      const entry = RASHI_DATA.find(r => r.gu === data.id);
      if(!entry) return data.text;
      const en = entry.en.split(' ')[0];
      const $el = $('<span></span>');
      $el.append($('<strong></strong>').text(entry.gu));
      $el.append($('<span style="color:#5A7A8C;font-size:11px;margin-left:8px;font-weight:400;"></span>').text(en));
      return $el;
    },
    templateSelection: function(data){
      if(!data.id) return $('<span style="color:#94A3B8;">'+rPh+'</span>');
      const entry = RASHI_DATA.find(r => r.gu === data.id);
      return entry ? entry.gu : data.id;
    }
  });

  document.getElementById("form-back").addEventListener("click", ()=>{ state.screen = "myProfiles"; render(); });

  document.getElementById("ff-next").addEventListener("click", ()=>{
    const name = document.getElementById("ff-name").value.trim();
    const gender = (typeof $!=='undefined') ? $('#ff-gender').val() : document.getElementById("ff-gender").value;
    const age = document.getElementById("ff-age").value;
    const fatherName = document.getElementById("ff-father").value.trim();
    const motherName = document.getElementById("ff-mother").value.trim();
    const rashi = (typeof $!=='undefined') ? $('#ff-rashi').val() : document.getElementById("ff-rashi").value;
    const errEl = document.getElementById("ff-err");

    if(!name || !gender || !age || !fatherName || !motherName){
      errEl.innerHTML = `<div class="bg-red-50 text-danger text-xs font-semibold p-2.5 rounded-xl border border-red-200">${t('fillAllFields')}</div>`;
      return;
    }

    Object.assign(state.formDraft, { name, gender, age: Number(age), fatherName, motherName, rashi });
    state.screen = "formStep2";
    render();
  });
}

function renderFormDocs(){
  const candidateId = state.uploadCandidateId;

  app.innerHTML = `

    <main class="flex-1 p-5 pb-12 space-y-4">
      <!-- Photo Upload Box -->

          <input type="file" accept="image/*" id="photo-input" class="w-full text-xs text-on-surface-variant file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-horizon-blue file:text-white hover:file:bg-deep-ocean cursor-pointer">
          <div id="photo-status" class="text-xs font-bold text-success mt-2"></div>
        </div>

        <div class="flex items-center justify-center gap-2 mt-5 pt-4 border-t border-soft-sky">
          <input type="checkbox" id="photo-visible-toggle" class="accent-deep-ocean w-4 h-4 rounded cursor-pointer">
          <label for="photo-visible-toggle" class="text-xs font-bold text-deep-ocean cursor-pointer">મારો Photo બીજા સભ્યોને દેખાડો</label>
        </div>
        <p class="text-[10px] text-on-surface-variant mt-1">${t('photoDefault')}</p>
      </div>

      <!-- Verification Docs Upload -->
      <div class="bg-white rounded-3xl p-6 shadow-ambient border border-soft-sky/60 space-y-3">
        <h3 class="font-display font-bold text-deep-ocean text-base mb-1">${t('docsRequired')}</h3>
        <p class="text-[11px] text-on-surface-variant font-medium mb-3">${t('docsNote')}</p>

        ${["aadhar","education","lc"].map(key => `
          <div class="border border-soft-sky rounded-2xl p-3.5 bg-surface/40">
            <div class="font-bold text-xs text-deep-ocean mb-1.5 flex items-center gap-1.5">
              <span class="material-symbols-outlined text-sm text-horizon-blue">
                ${key === 'aadhar' ? 'badge' : key === 'education' ? 'school' : 'description'}
              </span>
              <span>${key === 'aadhar' ? 'Aadhar Card' : key === 'education' ? 'શિક્ષણ પ્રમાણપત્ર (Degree / Marksheet)' : 'જન્મ તારીખ દાખલો / LC'}</span>
            </div>
            <input type="file" accept="image/*,.pdf" data-doc="${key}" class="w-full text-[11px] text-on-surface-variant file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-soft-sky file:text-deep-ocean cursor-pointer">
            <div id="doc-status-${key}" class="text-[11px] font-bold text-success mt-1"></div>
          </div>
        `).join("")}

        <button id="docs-done" class="w-full mt-4 bg-earth-warmth hover:bg-earth-dark text-white py-3.5 rounded-xl text-sm font-bold shadow-ambient transition-all flex items-center justify-center gap-2">
          <span>${t('doneBtn')}</span>
          <span class="material-symbols-outlined text-base">check_circle</span>
        </button>
      </div>
    </main>
  `;

  document.getElementById("form-back").addEventListener("click", ()=>{ state.screen = "myProfiles"; render(); });

  document.getElementById("photo-visible-toggle").addEventListener("change", async (e)=>{
    try{ await dataService.setPhotoVisibility(candidateId, e.target.checked); }
    catch(err){ showToast("Error: " + err.message); e.target.checked = !e.target.checked; }
  });

  document.getElementById("photo-input").addEventListener("change", async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const statusEl = document.getElementById("photo-status");
    statusEl.innerHTML = `<span class="animate-pulse">Upload થઈ રહ્યું છે...</span>`;
    try{
      await dataService.uploadPhoto(candidateId, file);
      statusEl.textContent = "✓ Photo Upload થઈ ગયો";
      statusEl.className = "text-xs font-bold text-success mt-2";
    }catch(err){
      statusEl.className = "text-xs font-bold text-danger mt-2";
      statusEl.textContent = "Error: " + err.message;
    }
  });

  document.querySelectorAll("[data-doc]").forEach(input => {
    input.addEventListener("change", async (e)=>{
      const key = input.getAttribute("data-doc");
      const file = e.target.files[0]; if(!file) return;
      const statusEl = document.getElementById("doc-status-" + key);
      statusEl.innerHTML = `<span class="animate-pulse">Upload થઈ રહ્યું છે...</span>`;
      try{
        await dataService.uploadDocument(candidateId, key, file);
        statusEl.textContent = "✓ Document Upload થઈ ગયું";
        statusEl.className = "text-[11px] font-bold text-success mt-1";
      }catch(err){
        statusEl.className = "text-[11px] font-bold text-danger mt-1";
        statusEl.textContent = "Error: " + err.message;
      }
    });
  });

  document.getElementById("docs-done").addEventListener("click", ()=>{
    state.uploadCandidateId = null;
    state.screen = "myProfiles";
    render();
  });
}

// Initial Kickoff
render();
</script>
